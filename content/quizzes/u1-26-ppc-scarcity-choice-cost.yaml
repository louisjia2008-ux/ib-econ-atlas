  type: short-answer
  prompt:
    zh-CN: 简要解释“PPC中的稀缺、选择与机会成本”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “Scarcity, choice, and cost on a PPC”, including one causal
      mechanism and one important implication.
  modelAnswer:
    zh-CN: 在 PPC 模型中，边界限制表示稀缺；边界上的可选组合表示选择；从一点移动到另一点所减少的另一种产出数量表示机会成本。
      资源限制形成生产边界；社会在边界上选择一种产出组合；增加横轴产出需要重新配置资源；纵轴产出的减少量成为横轴产出的机会成本 边界体现当前生产限制。
    en: Within the PPC model, the frontier represents scarcity, alternative feasible
      combinations represent choice, and the reduction in one output when moving
      along the curve measures the opportunity cost of more of the other.
      Resource constraints create a production boundary; Society selects one
      combination on the boundary; More horizontal-axis output requires
      reallocation; The lost vertical-axis output is its opportunity cost The
      frontier displays a current productive constraint.
