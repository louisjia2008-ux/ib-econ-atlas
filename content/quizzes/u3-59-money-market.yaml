- id: u3-59-money-market-flash-1
  knowledgePointId: u3-59-money-market
  type: flashcard
  prompt:
    zh-CN: 解释“货币市场与均衡利率”，并说明一个关键条件。
    en: Explain The money market and equilibrium interest and state one important
      condition.
  answer:
    zh-CN: 在简单流动性偏好模型中，货币需求随持币机会成本即名义利率上升而下降；给定货币供给与需求交点确定利率。
    en: In a simple liquidity-preference model, money demand falls as the nominal
      interest opportunity cost of holding money rises. Its intersection with
      given money supply determines interest.
  explanation:
    zh-CN: 货币市场纵轴是名义利率，横轴是货币数量，不是商品价格与产量。
    en: The axes are nominal interest and money quantity, not a good’s price and
      output.
- id: u3-59-money-market-mcq-1
  knowledgePointId: u3-59-money-market
  type: mcq
  prompt:
    zh-CN: 其他条件不变，模型货币供给增加通常怎样影响利率？
    en: Other things equal, how does more money supply affect model equilibrium
      interest?
  options:
    - id: a
      zh-CN: 利率必上升
      en: Interest must rise
    - id: b
      zh-CN: 实际产能必立即翻倍
      en: Real capacity must instantly double
    - id: c
      zh-CN: 利率下降
      en: Interest falls
    - id: d
      zh-CN: 纵轴改为实际 GDP
      en: The vertical axis becomes real GDP
  correctOptionId: c
  explanation:
    zh-CN: 利率下降。 利率提高持币机会成本；货币需求量下降；供需交点形成模型均衡 货币市场纵轴是名义利率，横轴是货币数量，不是商品价格与产量。
    en: Interest falls. Interest raises the opportunity cost of money; quantity of
      money demanded falls; demand and supply intersect at model equilibrium The
      axes are nominal interest and money quantity, not a good’s price and
      output.
- id: u3-59-money-market-short-1
  knowledgePointId: u3-59-money-market
  type: short-answer
  prompt:
    zh-CN: 解释货币市场与均衡利率的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of The money market and equilibrium interest and apply
      it to an example of your own.
  modelAnswer:
    zh-CN: 在简单流动性偏好模型中，货币需求随持币机会成本即名义利率上升而下降；给定货币供给与需求交点确定利率。
      利率提高持币机会成本；货币需求量下降；供需交点形成模型均衡
      原创假设：收入与价格等不变，货币供给右移可降低均衡利率；真实央行也可直接以政策利率为操作目标，不能把示意模型当作所有制度的逐日流程。
    en: "In a simple liquidity-preference model, money demand falls as the nominal
      interest opportunity cost of holding money rises. Its intersection with
      given money supply determines interest. Interest raises the opportunity
      cost of money; quantity of money demanded falls; demand and supply
      intersect at model equilibrium Hypothetical scenario: holding income and
      prices constant, a rightward money-supply shift lowers equilibrium
      interest. Actual central banks may target a policy rate directly; the
      schematic is not every system’s daily operating process."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 利率
        en: interest
      alternatives:
        zh-CN:
          - 利率
          - 利率提高持币机会成本
        en:
          - interest
          - Interest raises the opportunity cost of money
    - id: mechanism-2
      label:
        zh-CN: 货币需求
        en: money demand
      alternatives:
        zh-CN:
          - 货币需求
          - 货币需求量下降
        en:
          - money demand
          - quantity of money demanded falls
    - id: mechanism-3
      label:
        zh-CN: 供给
        en: supply
      alternatives:
        zh-CN:
          - 供给
          - 供需交点形成模型均衡
        en:
          - supply
          - demand and supply intersect at model equilibrium
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
