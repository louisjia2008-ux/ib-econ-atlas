- id: u4-07-tariff-flash-1
  knowledgePointId: u4-07-tariff
  type: flashcard
  prompt:
    zh-CN: 解释“关税与小国福利”，并说明一个关键条件。
    en: Explain Tariffs and small-country welfare and state one important condition.
  answer:
    zh-CN: 单位关税对每单位进口征固定税额。假设小国不能改变 Pw 且税后仍有进口，国内价升至
      Pw+t，国内供给增加、消费减少、进口缩小；消费者受损，生产者和政府获得转移，无外部性模型留下 b+d 的净损失。
    en: A specific tariff charges a fixed tax per imported unit. If a small economy
      cannot change Pw and imports remain positive, domestic price rises to
      Pw+t, supply rises, consumption and imports fall. Consumers lose;
      producers and government receive transfers, leaving net losses b+d without
      externalities.
  explanation:
    zh-CN: 关税收入应乘税后进口量；它是转移，不等于净福利增加。
    en: Use post-tariff imports for revenue; revenue is a transfer, not a net
      welfare gain.
- id: u4-07-tariff-mcq-1
  knowledgePointId: u4-07-tariff
  type: mcq
  prompt:
    zh-CN: 小国关税通常怎样影响进口？
    en: What normally happens to imports after a small-country tariff?
  options:
    - id: a
      zh-CN: 进口必定扩大
      en: Imports necessarily expand
    - id: b
      zh-CN: 消费者价格必定不变
      en: Consumer price cannot change
    - id: c
      zh-CN: 本国供给增加、需求减少，进口缩小
      en: Domestic supply rises, demand falls and imports shrink
    - id: d
      zh-CN: 税收就是净福利收益
      en: Revenue is the net welfare gain
  correctOptionId: c
  explanation:
    zh-CN: 本国供给增加、需求减少，进口缩小。 进口成本提高；国内生产增加消费减少；政府按税后进口量征税 关税收入应乘税后进口量；它是转移，不等于净福利增加。
    en: Domestic supply rises, demand falls and imports shrink. Import costs rise;
      domestic production rises and consumption falls; revenue is levied on
      post-tariff imports Use post-tariff imports for revenue; revenue is a
      transfer, not a net welfare gain.
- id: u4-07-tariff-short-1
  knowledgePointId: u4-07-tariff
  type: short-answer
  prompt:
    zh-CN: 解释关税与小国福利的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Tariffs and small-country welfare and apply it to
      an example of your own.
  modelAnswer:
    zh-CN: 关税是进口税。假定本国是世界价格接受者、商品同质、竞争市场，无外部性或报复，且税后仍有进口。单位关税使国内价由 Pw 升至 Pw+t；企业沿 S
      增产至 Qs1，消费者沿 D 减少购买至 Qd1，进口缩小到 Qd1−Qs1。消费者剩余减少 a+b+c+d，生产者获得 a，政府税收为
      c；本国转移 a 与 c 相抵后，生产扭曲 b 与消费扭曲 d
      构成净损失。例如原创假设某小国对进口大米征单位关税：国内米厂扩产、家庭减少购买，进口差额缩小。不能仅由米厂获益推断全国净福利增加。
    en: A tariff taxes imports. Assume a price-taking economy, homogeneous goods,
      competition, no externalities or retaliation and positive remaining
      imports. A specific tariff raises domestic price from Pw to Pw+t. Firms
      move along S to Qs1 and consumers along D to Qd1; imports fall to Qd1−Qs1.
      Consumers lose a+b+c+d, producers gain a and government receives revenue
      c. Transfers a and c cancel, leaving production and consumption losses
      b+d. In an original hypothetical rice-importing economy, a tariff
      encourages local mills to expand while households buy less, shrinking the
      import gap. Producer gains alone do not establish a national welfare gain.
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 关税
        en: tariff
      alternatives:
        zh-CN:
          - 关税
          - 进口成本提高
        en:
          - tariff
          - Import costs rise
    - id: mechanism-2
      label:
        zh-CN: 进口
        en: imports
      alternatives:
        zh-CN:
          - 进口
          - 国内生产增加消费减少
        en:
          - imports
          - domestic production rises and consumption falls
    - id: mechanism-3
      label:
        zh-CN: 税收
        en: revenue
      alternatives:
        zh-CN:
          - 税收
          - 政府按税后进口量征税
        en:
          - revenue
          - revenue is levied on post-tariff imports
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
- id: u4-07-tariff-mcq-hl-1
  knowledgePointId: u4-07-tariff
  type: mcq
  level: hl
  prompt:
    zh-CN: 单位关税 3，税后进口 20，税收多少？
    en: A tariff of three with post-tariff imports of twenty yields what revenue?
  options:
    - id: a
      zh-CN: "23"
      en: "23"
    - id: b
      zh-CN: "17"
      en: "17"
    - id: c
      zh-CN: 必须用税前进口量
      en: The pre-tariff import volume must be used
    - id: d
      zh-CN: "60"
      en: "60"
  correctOptionId: d
  explanation:
    zh-CN: 60。 3 × 20 = 60
    en: 60. 3 × 20 = 60
