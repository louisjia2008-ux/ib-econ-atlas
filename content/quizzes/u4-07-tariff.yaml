- id: u4-07-tariff-flash-1
  knowledgePointId: u4-07-tariff
  type: flashcard
  prompt:
    zh-CN: 解释“关税与小国福利”，并说明一个关键条件。
    en: Explain Tariffs and small-country welfare and state one important condition.
  answer:
    zh-CN: 关税是进口税；小国单位关税把国内价从 Pw 提高至 Pw+t，降低进口并产生税收与效率损失。
    en: A tariff taxes imports. In a small economy a specific tariff raises domestic
      price from Pw to Pw+t, reduces imports and creates revenue and efficiency
      losses.
  explanation:
    zh-CN: 关税收入应乘税后进口量；它是转移，不等于净福利增加。
    en: Use post-tariff imports for revenue; revenue is a transfer, not a net
      welfare gain.
- id: u4-07-tariff-mcq-1
  knowledgePointId: u4-07-tariff
  type: mcq
  prompt:
    zh-CN: 单位关税 3，税后进口 20，税收多少？
    en: A tariff of three with post-tariff imports of twenty yields what revenue?
  options:
    - id: a
      zh-CN: "23"
      en: "23"
    - id: b
      zh-CN: "17"
      en: "17"
    - id: c
      zh-CN: "60"
      en: "60"
    - id: d
      zh-CN: 必须用税前进口量
      en: The pre-tariff import volume must be used
  correctOptionId: c
  explanation:
    zh-CN: 60。 原创假设：Pw=10，税 t=2，税后 Qd=90、Qs=50，进口 40，税收 80。无外部性和报复时仍有生产与消费扭曲损失。
      关税收入应乘税后进口量；它是转移，不等于净福利增加。
    en: "60. Hypothetical scenario: Pw=10, t=2, post-tariff Qd=90 and Qs=50. Imports
      are 40 and revenue 80. Production and consumption distortions remain even
      without externalities or retaliation. Use post-tariff imports for revenue;
      revenue is a transfer, not a net welfare gain."
- id: u4-07-tariff-short-1
  knowledgePointId: u4-07-tariff
  type: short-answer
  prompt:
    zh-CN: 解释关税与小国福利的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Tariffs and small-country welfare and apply it to
      an example of your own.
  modelAnswer:
    zh-CN: 关税是进口税；小国单位关税把国内价从 Pw 提高至 Pw+t，降低进口并产生税收与效率损失。
      进口成本提高；国内生产增加消费减少；政府按税后进口量征税 原创假设：Pw=10，税 t=2，税后 Qd=90、Qs=50，进口 40，税收
      80。无外部性和报复时仍有生产与消费扭曲损失。
    en: "A tariff taxes imports. In a small economy a specific tariff raises
      domestic price from Pw to Pw+t, reduces imports and creates revenue and
      efficiency losses. Import costs rise; domestic production rises and
      consumption falls; revenue is levied on post-tariff imports Hypothetical
      scenario: Pw=10, t=2, post-tariff Qd=90 and Qs=50. Imports are 40 and
      revenue 80. Production and consumption distortions remain even without
      externalities or retaliation."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 关税
        en: tariff
      alternatives:
        zh-CN:
          - 关税
          - 进口成本提高
        en:
          - tariff
          - Import costs rise
    - id: mechanism-2
      label:
        zh-CN: 进口
        en: imports
      alternatives:
        zh-CN:
          - 进口
          - 国内生产增加消费减少
        en:
          - imports
          - domestic production rises and consumption falls
    - id: mechanism-3
      label:
        zh-CN: 税收
        en: revenue
      alternatives:
        zh-CN:
          - 税收
          - 政府按税后进口量征税
        en:
          - revenue
          - revenue is levied on post-tariff imports
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
