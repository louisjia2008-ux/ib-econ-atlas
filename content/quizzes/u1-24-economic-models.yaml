- id: u1-24-economic-models-short-1
  knowledgePointId: u1-24-economic-models
  type: short-answer
  prompt:
    zh-CN: 简要解释“经济模型的作用与局限”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “Purposes and limits of economic models”, including one
      causal mechanism and one important implication.
  modelAnswer:
    zh-CN: 经济模型是对现实经济主体、约束和关系的有目的简化，用文字、图形或数学表达因果机制并形成可检验预测。
      研究者提出一个具体问题；保留被认为关键的变量和关系；用假设隔离机制并推出预测；把预测与证据比较后修正模型 模型把复杂现实压缩成关键关系。
    en: An economic model is a purposeful simplification of agents, constraints, and
      relationships, expressed verbally, graphically, or mathematically to
      explain a mechanism and generate testable predictions. A researcher
      specifies a focused question; Variables and relationships judged essential
      are retained; Assumptions isolate a mechanism and yield predictions;
      Predictions are compared with evidence and the model is revised Models
      compress complexity into selected relationships.
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
        zh-CN:
          - 经济模型的作用与局限
          - 经济抽象
          - 简化框架
          - economic representation
        en:
          - Purposes and limits of economic models
          - economic abstraction
          - simplified framework
          - economic representation
    - id: mechanism
      label:
        zh-CN: 因果机制
        en: Causal mechanism
      alternatives:
        zh-CN:
          - 研究者提出一个具体问题
          - 保留被认为关键的变量和关系
        en:
          - A researcher specifies a focused question
          - Variables and relationships judged essential are retained
    - id: implication
      label:
        zh-CN: 重要含义
        en: Important implication
      alternatives:
        zh-CN:
          - 模型把复杂现实压缩成关键关系。
          - 假设决定结论的适用范围。
        en:
          - Models compress complexity into selected relationships.
          - Assumptions define the range of a conclusion.
  explanation:
    zh-CN: 系统按核心概念、因果机制和重要含义三个关键词组计算覆盖率；你可以查看依据并手动修正最终判定。
    en: Coverage is calculated across the core concept, causal mechanism, and
      implication groups; you can inspect and override the final judgement.
