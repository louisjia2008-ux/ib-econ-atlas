    en: Which statement best captures “Purposes and limits of economic models”?
  options:
    - id: a
      zh-CN: 经济模型有意简化现实来突出关键关系；好模型不是细节最多，而是在明确假设下对问题有解释力。
      en: An economic model deliberately simplifies reality to isolate important
