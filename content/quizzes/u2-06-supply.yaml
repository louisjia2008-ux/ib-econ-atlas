- id: u2-06-supply-flash-1
  knowledgePointId: u2-06-supply
  type: flashcard
  prompt:
    zh-CN: 解释“供给与供给量”，并说明一个关键条件。
    en: Explain Supply and quantity supplied and state one important condition.
  answer:
    zh-CN: 供给是生产者在给定时期、不同价格下愿意且能够出售的数量关系；供给量是某一个价格下的数量。
    en: Supply relates quantities producers are willing and able to sell at
      different prices during a period. Quantity supplied is the quantity at one
      price.
  explanation:
    zh-CN: 供给不等于仓库存货；存货只有在相应价格下愿意出售才进入供给。
    en: Supply is not simply inventory; inventory enters supply when the producer is
      willing to sell it at the relevant price.
- id: u2-06-supply-mcq-1
  knowledgePointId: u2-06-supply
  type: mcq
  prompt:
    zh-CN: 商品自身价格上升，其他条件不变，通常出现什么？
    en: Own price rises with other conditions unchanged. What normally follows?
  options:
    - id: a
      zh-CN: 供给曲线左移
      en: Supply shifts left
    - id: b
      zh-CN: 沿供给曲线增加供给量
      en: Higher quantity supplied along supply
    - id: c
      zh-CN: 供给曲线右移
      en: Supply shifts right
    - id: d
      zh-CN: 需求曲线必然右移
      en: Demand necessarily shifts right
  correctOptionId: b
  explanation:
    zh-CN: 沿供给曲线增加供给量。 原创例：蛋糕价格从 20 升到 25 元，糕点师延长工作时间而多做 10
      个。若投入价格和技术未变，这是沿供给曲线移动，不是供给曲线右移。 供给不等于仓库存货；存货只有在相应价格下愿意出售才进入供给。
    en: "Higher quantity supplied along supply. Illustrative example: cake prices
      rise from 20 to 25 and a baker works longer to make ten more. With input
      prices and technology unchanged, this is a movement along supply, not a
      shift. Supply is not simply inventory; inventory enters supply when the
      producer is willing to sell it at the relevant price."
- id: u2-06-supply-short-1
  knowledgePointId: u2-06-supply
  type: short-answer
  prompt:
    zh-CN: 解释供给与供给量的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Supply and quantity supplied and apply it to an
      example of your own.
  modelAnswer:
    zh-CN: 供给是生产者在给定时期、不同价格下愿意且能够出售的数量关系；供给量是某一个价格下的数量。
      其他生产条件保持不变；价格上升提高额外生产的收益；供给量通常沿原曲线增加 原创例：蛋糕价格从 20 升到 25 元，糕点师延长工作时间而多做 10
      个。若投入价格和技术未变，这是沿供给曲线移动，不是供给曲线右移。
    en: "Supply relates quantities producers are willing and able to sell at
      different prices during a period. Quantity supplied is the quantity at one
      price. Hold production conditions constant; a higher price increases the
      return on extra production; quantity supplied normally rises along the
      curve Illustrative example: cake prices rise from 20 to 25 and a baker
      works longer to make ten more. With input prices and technology unchanged,
      this is a movement along supply, not a shift."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 自身价格
        en: own price
      alternatives:
        zh-CN:
          - 自身价格
          - 其他生产条件保持不变
        en:
          - own price
          - Hold production conditions constant
    - id: mechanism-2
      label:
        zh-CN: 收益
        en: return
      alternatives:
        zh-CN:
          - 收益
          - 价格上升提高额外生产的收益
        en:
          - return
          - a higher price increases the return on extra production
    - id: mechanism-3
      label:
        zh-CN: 沿曲线
        en: along
      alternatives:
        zh-CN:
          - 沿曲线
          - 供给量通常沿原曲线增加
        en:
          - along
          - quantity supplied normally rises along the curve
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
