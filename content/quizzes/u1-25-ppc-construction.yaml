- id: u1-25-ppc-construction-short-1
  knowledgePointId: u1-25-ppc-construction
  type: short-answer
  prompt:
    zh-CN: 简要解释“生产可能性曲线的构造”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “Constructing a PPC”, including one causal mechanism and one
      important implication.
  modelAnswer:
    zh-CN: 生产可能性曲线的构造：生产可能性曲线（PPC）是在既定资源、技术和充分有效利用假设下，一个经济体在两类商品或服务之间能够生产的最大组合边界。
      固定时期、资源数量与技术；把产出归纳为横纵轴两类；计算每种资源配置下的最大产出组合；连接有效组合形成生产可能性边界 PPC
      是最大可行产出组合的边界。
    en: "Constructing a PPC: A production possibility curve (PPC) is the boundary of
      maximum combinations of two goods or services that an economy can produce
      when resources and technology are given and resources are fully and
      efficiently employed. Fix the period, resource stock, and technology;
      Aggregate output into two labelled axes; Find maximum output under
      alternative resource allocations; Join the efficient combinations to form
      the frontier The PPC is the boundary of maximum feasible output
      combinations."
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
