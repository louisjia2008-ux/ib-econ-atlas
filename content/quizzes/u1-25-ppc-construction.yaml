        en:
          - Constructing a PPC
          - production possibility frontier
          - PPF
          - transformation curve
    - id: mechanism
      label:
        zh-CN: 因果机制
        en: Causal mechanism
      alternatives:
        zh-CN:
          - 固定时期、资源数量与技术
          - 把产出归纳为横纵轴两类
        en:
          - Fix the period, resource stock, and technology
          - Aggregate output into two labelled axes
    - id: implication
      label:
        zh-CN: 重要含义
        en: Important implication
