- id: u3-40-monetary-transmission-flash-1
  knowledgePointId: u3-40-monetary-transmission
  type: flashcard
  prompt:
    zh-CN: 解释“货币政策传导”，并说明一个关键条件。
    en: Explain Monetary transmission and state one important condition.
  answer:
    zh-CN: 利率通过借贷、储蓄、资产价格、预期和汇率等渠道影响总需求；效果有时滞且取决于金融与汇率制度。
    en: Interest rates affect aggregate demand through borrowing, saving, asset
      prices, expectations and exchange rates. Effects have lags and depend on
      financial and exchange-rate arrangements.
  explanation:
    zh-CN: 降息不保证汇率或投资按固定幅度变化。
    en: A rate cut does not guarantee a fixed exchange-rate or investment response.
- id: u3-40-monetary-transmission-mcq-1
  knowledgePointId: u3-40-monetary-transmission
  type: mcq
  prompt:
    zh-CN: 什么会削弱降息的投资渠道？
    en: What weakens the investment channel of a rate cut?
  options:
    - id: a
      zh-CN: 所有项目必然盈利
      en: Every project becomes profitable
    - id: b
      zh-CN: 贷款成本必然为零
      en: Borrowing necessarily becomes free
    - id: c
      zh-CN: 总需求不含投资
      en: Aggregate demand excludes investment
    - id: d
      zh-CN: 企业对未来销售缺乏信心
      en: Firms lack confidence in future sales
  correctOptionId: d
  explanation:
    zh-CN: 企业对未来销售缺乏信心。
      原创例：浮动汇率下，相对利率下降可能减少资本流入并使货币贬值，从而支持净出口；但进口成本也会上升。固定利率房贷较多时，家庭现金流反应可能较慢。
      降息不保证汇率或投资按固定幅度变化。
    en: "Firms lack confidence in future sales. Illustrative example: under floating
      exchange rates, lower relative interest may reduce capital inflows and
      depreciate the currency, supporting net exports while raising import
      costs. Household cash-flow responses may be slower where fixed-rate
      mortgages dominate. A rate cut does not guarantee a fixed exchange-rate or
      investment response."
- id: u3-40-monetary-transmission-short-1
  knowledgePointId: u3-40-monetary-transmission
  type: short-answer
  prompt:
    zh-CN: 解释货币政策传导的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Monetary transmission and apply it to an example of
      your own.
  modelAnswer:
    zh-CN: 利率通过借贷、储蓄、资产价格、预期和汇率等渠道影响总需求；效果有时滞且取决于金融与汇率制度。
      利率改变融资与储蓄回报；家庭企业调整消费投资；总需求变化影响实际产出和物价
      原创例：浮动汇率下，相对利率下降可能减少资本流入并使货币贬值，从而支持净出口；但进口成本也会上升。固定利率房贷较多时，家庭现金流反应可能较慢。
    en: "Interest rates affect aggregate demand through borrowing, saving, asset
      prices, expectations and exchange rates. Effects have lags and depend on
      financial and exchange-rate arrangements. Rates change financing costs and
      saving returns; households and firms adjust consumption and investment;
      changing aggregate demand affects output and prices Illustrative example:
      under floating exchange rates, lower relative interest may reduce capital
      inflows and depreciate the currency, supporting net exports while raising
      import costs. Household cash-flow responses may be slower where fixed-rate
      mortgages dominate."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 融资成本
        en: financing costs
      alternatives:
        zh-CN:
          - 融资成本
          - 利率改变融资与储蓄回报
        en:
          - financing costs
          - Rates change financing costs and saving returns
    - id: mechanism-2
      label:
        zh-CN: 消费投资
        en: consumption and investment
      alternatives:
        zh-CN:
          - 消费投资
          - 家庭企业调整消费投资
        en:
          - consumption and investment
          - households and firms adjust consumption and investment
    - id: mechanism-3
      label:
        zh-CN: 总需求
        en: aggregate demand
      alternatives:
        zh-CN:
          - 总需求
          - 总需求变化影响实际产出和物价
        en:
          - aggregate demand
          - changing aggregate demand affects output and prices
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
