- id: u4-01-trade-benefits-flash-1
  knowledgePointId: u4-01-trade-benefits
  type: flashcard
  prompt:
    zh-CN: 解释“贸易、专业化与竞争”，并说明一个关键条件。
    en: Explain Trade, specialisation and competition and state one important
      condition.
  answer:
    zh-CN: 国际贸易通过专业化、更大市场、竞争和技术传播扩大消费选择，但收益分配不均。
    en: Trade can widen consumption choices through specialisation, larger markets,
      competition and technology diffusion, but gains are unevenly distributed.
  explanation:
    zh-CN: 总收益增加不代表每个人都获益；调整成本、环境成本和依赖性需要单独评价。
    en: Aggregate gains do not mean everyone gains; adjustment costs, environmental
      effects and dependence require separate evaluation.
- id: u4-01-trade-benefits-mcq-1
  knowledgePointId: u4-01-trade-benefits
  type: mcq
  prompt:
    zh-CN: 更大出口市场如何帮助降低单位成本？
    en: How can a larger export market reduce unit costs?
  options:
    - id: a
      zh-CN: 分摊固定成本
      en: Spreading fixed costs
    - id: b
      zh-CN: 必然消除所有失业
      en: Necessarily removing all unemployment
    - id: c
      zh-CN: 使资源不再稀缺
      en: Ending resource scarcity
    - id: d
      zh-CN: 保证每家企业盈利
      en: Guaranteeing profit for every firm
  correctOptionId: a
  explanation:
    zh-CN: 分摊固定成本。 更大市场支持专业化；规模扩大可降低平均成本；竞争约束价格并促进创新
      总收益增加不代表每个人都获益；调整成本、环境成本和依赖性需要单独评价。
    en: Spreading fixed costs. Larger markets support specialisation; greater scale
      can reduce average costs; competition can restrain prices and encourage
      innovation Aggregate gains do not mean everyone gains; adjustment costs,
      environmental effects and dependence require separate evaluation.
- id: u4-01-trade-benefits-short-1
  knowledgePointId: u4-01-trade-benefits
  type: short-answer
  prompt:
    zh-CN: 解释贸易、专业化与竞争的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Trade, specialisation and competition and apply it
      to an example of your own.
  modelAnswer:
    zh-CN: 国际贸易通过专业化、更大市场、竞争和技术传播扩大消费选择，但收益分配不均。 更大市场支持专业化；规模扩大可降低平均成本；竞争约束价格并促进创新
      原创假设：本国药品企业进入更大市场，分摊研发成本；消费者可能获得低价药，但低效率企业的工人可能需要转岗。
    en: "Trade can widen consumption choices through specialisation, larger markets,
      competition and technology diffusion, but gains are unevenly distributed.
      Larger markets support specialisation; greater scale can reduce average
      costs; competition can restrain prices and encourage innovation
      Hypothetical scenario: a medicine producer spreads research costs across a
      larger market. Consumers may obtain cheaper medicines while workers in
      less efficient firms face retraining."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 专业化
        en: specialisation
      alternatives:
        zh-CN:
          - 专业化
          - 更大市场支持专业化
        en:
          - specialisation
          - Larger markets support specialisation
    - id: mechanism-2
      label:
        zh-CN: 规模
        en: scale
      alternatives:
        zh-CN:
          - 规模
          - 规模扩大可降低平均成本
        en:
          - scale
          - greater scale can reduce average costs
    - id: mechanism-3
      label:
        zh-CN: 竞争
        en: competition
      alternatives:
        zh-CN:
          - 竞争
          - 竞争约束价格并促进创新
        en:
          - competition
          - competition can restrain prices and encourage innovation
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
