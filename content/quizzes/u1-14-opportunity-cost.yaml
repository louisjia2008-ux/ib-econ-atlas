- id: u1-14-opportunity-cost-flash-1
  knowledgePointId: u1-14-opportunity-cost
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“机会成本”。
    en: Without notes, explain “Opportunity cost” in your own words.
  answer:
    zh-CN: 机会成本是在资源用于某项选择后无法获得的次优可行方案的收益或价值。
    en: Opportunity cost is the benefit or value of the next-best feasible
      alternative that cannot be obtained once resources are committed to a
      chosen use.
  explanation:
    zh-CN: 机会成本是作出选择时放弃的最佳可行替代方案的价值，而不是所有放弃选项之和。
    en: Opportunity cost is the value of the best feasible alternative forgone when
      a choice is made, not the sum of every rejected option.
