- id: u2-33-market-failure-flash-1
  knowledgePointId: u2-33-market-failure
  type: flashcard
  prompt:
    zh-CN: 解释“市场失灵与社会最优”，并说明一个关键条件。
    en: Explain Market failure and the social optimum and state one important
      condition.
  answer:
    zh-CN: 市场失灵是市场无法实现配置效率。社会最优数量满足社会边际收益 MSB 等于社会边际成本 MSC。
    en: Market failure occurs when a market does not achieve allocative efficiency.
      The socially optimal quantity satisfies marginal social benefit, MSB,
      equal to marginal social cost, MSC.
  explanation:
    zh-CN: 高价格或不平等本身不能单独证明配置失灵，需说明偏离效率的机制。
    en: A high price or inequality alone does not establish allocative failure;
      identify the mechanism producing inefficiency.
- id: u2-33-market-failure-mcq-1
  knowledgePointId: u2-33-market-failure
  type: mcq
  prompt:
    zh-CN: 社会最优的边际条件是什么？
    en: What marginal condition defines the social optimum?
  options:
    - id: a
      zh-CN: MSB=MSC
      en: MSB=MSC
    - id: b
      zh-CN: 总收入最大
      en: Maximum total revenue
    - id: c
      zh-CN: 价格为零
      en: Zero price
    - id: d
      zh-CN: 私人利润最大一定足够
      en: Maximum private profit is always sufficient
  correctOptionId: a
  explanation:
    zh-CN: MSB=MSC。 私人决策只考虑私人收益与成本；外部影响或制度缺陷使其偏离社会量；市场数量与 MSB=MSC 数量不一致
      高价格或不平等本身不能单独证明配置失灵，需说明偏离效率的机制。
    en: MSB=MSC. Private decisions consider private benefits and costs; external
      effects or institutional failures separate them from social values; market
      output differs from the MSB=MSC quantity A high price or inequality alone
      does not establish allocative failure; identify the mechanism producing
      inefficiency.
- id: u2-33-market-failure-short-1
  knowledgePointId: u2-33-market-failure
  type: short-answer
  prompt:
    zh-CN: 解释市场失灵与社会最优的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Market failure and the social optimum and apply it
      to an example of your own.
  modelAnswer:
    zh-CN: 市场失灵是市场无法实现配置效率。社会最优数量满足社会边际收益 MSB 等于社会边际成本 MSC。
      私人决策只考虑私人收益与成本；外部影响或制度缺陷使其偏离社会量；市场数量与 MSB=MSC 数量不一致 原创例：生产者多生产一单位获得 12
      的收益，私人成本 9，但污染成本 5，使社会成本为 14。这一单位私人有利、社会净收益为负。应比较边际量，不是平均收益和平均成本。
    en: "Market failure occurs when a market does not achieve allocative efficiency.
      The socially optimal quantity satisfies marginal social benefit, MSB,
      equal to marginal social cost, MSC. Private decisions consider private
      benefits and costs; external effects or institutional failures separate
      them from social values; market output differs from the MSB=MSC quantity
      Illustrative example: one more unit yields benefit 12, private cost nine
      and external pollution cost five, making social cost 14. The unit is
      privately beneficial but socially harmful. Compare marginal values, not
      average benefits and costs."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 社会边际成本
        en: marginal social cost
      alternatives:
        zh-CN:
          - 社会边际成本
          - 私人决策只考虑私人收益与成本
        en:
          - marginal social cost
          - Private decisions consider private benefits and costs
    - id: mechanism-2
      label:
        zh-CN: 社会边际收益
        en: marginal social benefit
      alternatives:
        zh-CN:
          - 社会边际收益
          - 外部影响或制度缺陷使其偏离社会量
        en:
          - marginal social benefit
          - external effects or institutional failures separate them from social
            values
    - id: mechanism-3
      label:
        zh-CN: 配置效率
        en: allocative efficiency
      alternatives:
        zh-CN:
          - 配置效率
          - 市场数量与 MSB=MSC 数量不一致
        en:
          - allocative efficiency
          - market output differs from the MSB=MSC quantity
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
