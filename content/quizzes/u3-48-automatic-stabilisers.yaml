- id: u3-48-automatic-stabilisers-flash-1
  knowledgePointId: u3-48-automatic-stabilisers
  type: flashcard
  prompt:
    zh-CN: 解释“自动稳定器”，并说明一个关键条件。
    en: Explain Automatic stabilisers and state one important condition.
  answer:
    zh-CN: 税收与符合资格的转移随收入和就业自动变化，可缓和周期波动，无须每次通过新的主动决策。
    en: Taxes and eligible transfers change automatically with income and
      employment, moderating cyclical fluctuations without a fresh discretionary
      decision each time.
  explanation:
    zh-CN: 自动不等于没有制度设计，也不等于新刺激法案。
    en: Automatic does not mean undesigned or a new stimulus law.
- id: u3-48-automatic-stabilisers-mcq-1
  knowledgePointId: u3-48-automatic-stabilisers
  type: mcq
  prompt:
    zh-CN: 哪项属于自动稳定器？
    en: Which is an automatic stabiliser?
  options:
    - id: a
      zh-CN: 临时新批准的大型基建
      en: A newly approved infrastructure programme
    - id: b
      zh-CN: 临时改变税率的投票
      en: A vote to change tax rates
    - id: c
      zh-CN: 央行新一次降息
      en: A fresh central-bank rate cut
    - id: d
      zh-CN: 按既有规则随失业增加的福利支出
      en: Benefits rising with unemployment under existing rules
  correctOptionId: d
  explanation:
    zh-CN: 按既有规则随失业增加的福利支出。 衰退降低税款并提高部分福利支出；可支配收入跌幅得到缓冲；消费与总需求的下降减弱
      自动不等于没有制度设计，也不等于新刺激法案。
    en: Benefits rising with unemployment under existing rules. Recession lowers tax
      payments and raises some benefits; disposable income falls less sharply;
      consumption and aggregate demand decline less Automatic does not mean
      undesigned or a new stimulus law.
- id: u3-48-automatic-stabilisers-short-1
  knowledgePointId: u3-48-automatic-stabilisers
  type: short-answer
  prompt:
    zh-CN: 解释自动稳定器的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Automatic stabilisers and apply it to an example of
      your own.
  modelAnswer:
    zh-CN: 税收与符合资格的转移随收入和就业自动变化，可缓和周期波动，无须每次通过新的主动决策。
      衰退降低税款并提高部分福利支出；可支配收入跌幅得到缓冲；消费与总需求的下降减弱
      原创例：失业增加后，原有失业保险规则自动支付更多补助，预算趋向赤字。它缓冲而非消除衰退；覆盖有限、资格限制或低替代率会削弱稳定作用。景气时税收回升则有反向作用。
    en: "Taxes and eligible transfers change automatically with income and
      employment, moderating cyclical fluctuations without a fresh discretionary
      decision each time. Recession lowers tax payments and raises some
      benefits; disposable income falls less sharply; consumption and aggregate
      demand decline less Illustrative example: existing unemployment insurance
      rules automatically pay more benefits as unemployment rises, pushing the
      budget toward deficit. They cushion rather than eliminate recession;
      limited coverage, eligibility restrictions or low replacement rates weaken
      stabilisation. Recovering tax revenues work in reverse during expansion."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 福利支出
        en: benefits
      alternatives:
        zh-CN:
          - 福利支出
          - 衰退降低税款并提高部分福利支出
        en:
          - benefits
          - Recession lowers tax payments and raises some benefits
    - id: mechanism-2
      label:
        zh-CN: 可支配收入
        en: disposable income
      alternatives:
        zh-CN:
          - 可支配收入
          - 可支配收入跌幅得到缓冲
        en:
          - disposable income
          - disposable income falls less sharply
    - id: mechanism-3
      label:
        zh-CN: 总需求
        en: aggregate demand
      alternatives:
        zh-CN:
          - 总需求
          - 消费与总需求的下降减弱
        en:
          - aggregate demand
          - consumption and aggregate demand decline less
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
