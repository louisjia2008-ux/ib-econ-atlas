- id: u4-27-exchange-policy-trilemma-flash-1
  knowledgePointId: u4-27-exchange-policy-trilemma
  type: flashcard
  prompt:
    zh-CN: 解释“汇率制度与政策约束”，并说明一个关键条件。
    en: Explain Exchange regimes and policy constraints and state one important
      condition.
  answer:
    zh-CN: 资本自由流动下，固定汇率约束独立货币政策；利差会引发资金流并迫使当局干预或调整政策。
    en: "With free capital mobility, a fixed exchange rate constrains independent
      monetary policy: interest differentials trigger flows requiring
      intervention or policy adjustment."
  explanation:
    zh-CN: 该约束依赖资本流动、风险与可信度，不表示所有国家任何时刻利率完全相同。
    en: The constraint depends on mobility, risk and credibility; it does not imply
      identical interest rates everywhere at every moment.
- id: u4-27-exchange-policy-trilemma-mcq-1
  knowledgePointId: u4-27-exchange-policy-trilemma
  type: mcq
  prompt:
    zh-CN: 固定汇率和自由资本流动下，什么受约束？
    en: What is constrained with a fixed rate and free capital flows?
  options:
    - id: a
      zh-CN: 所有国内生产
      en: All domestic production
    - id: b
      zh-CN: 任何教育支出
      en: Any education spending
    - id: c
      zh-CN: 独立货币政策
      en: Independent monetary policy
    - id: d
      zh-CN: 所有国际贸易
      en: All international trade
  correctOptionId: c
  explanation:
    zh-CN: 独立货币政策。 原创假设：一国希望降息刺激就业，又维持平价且允许资本自由流动；持续资本外流暴露三目标难以同时保持。
      该约束依赖资本流动、风险与可信度，不表示所有国家任何时刻利率完全相同。
    en: "Independent monetary policy. Hypothetical scenario: an economy wants lower
      rates for jobs, a fixed parity and free capital flows. Persistent outflows
      expose the difficulty of sustaining all three. The constraint depends on
      mobility, risk and credibility; it does not imply identical interest rates
      everywhere at every moment."
- id: u4-27-exchange-policy-trilemma-short-1
  knowledgePointId: u4-27-exchange-policy-trilemma
  type: short-answer
  prompt:
    zh-CN: 解释汇率制度与政策约束的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Exchange regimes and policy constraints and apply
      it to an example of your own.
  modelAnswer:
    zh-CN: 资本自由流动下，固定汇率约束独立货币政策；利差会引发资金流并迫使当局干预或调整政策。
      独立降息降低相对回报；资本流出增加贬值压力；捍卫固定汇率限制降息空间
      原创假设：一国希望降息刺激就业，又维持平价且允许资本自由流动；持续资本外流暴露三目标难以同时保持。
    en: "With free capital mobility, a fixed exchange rate constrains independent
      monetary policy: interest differentials trigger flows requiring
      intervention or policy adjustment. Independent rate cuts reduce relative
      returns; outflows add depreciation pressure; defending parity restricts
      rate cuts Hypothetical scenario: an economy wants lower rates for jobs, a
      fixed parity and free capital flows. Persistent outflows expose the
      difficulty of sustaining all three."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 资本流动
        en: capital mobility
      alternatives:
        zh-CN:
          - 资本流动
          - 独立降息降低相对回报
        en:
          - capital mobility
          - Independent rate cuts reduce relative returns
    - id: mechanism-2
      label:
        zh-CN: 固定汇率
        en: fixed exchange rate
      alternatives:
        zh-CN:
          - 固定汇率
          - 资本流出增加贬值压力
        en:
          - fixed exchange rate
          - outflows add depreciation pressure
    - id: mechanism-3
      label:
        zh-CN: 货币政策
        en: monetary policy
      alternatives:
        zh-CN:
          - 货币政策
          - 捍卫固定汇率限制降息空间
        en:
          - monetary policy
          - defending parity restricts rate cuts
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
