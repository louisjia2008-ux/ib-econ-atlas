- id: u1-37-utility-marginalism-flash-1
  knowledgePointId: u1-37-utility-marginalism
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“效用理论与边际主义”。
    en: Without notes, explain “Utility theory and marginalism” in your own words.
  answer:
    zh-CN: 效用理论把消费满足作为选择依据；边际主义关注一个变量微小增加所带来的额外效用、产出或成本，并以边际比较解释决策。
    en: Utility theory treats satisfaction from consumption as a basis for choice.
      Marginalism studies the extra utility, output, or cost created by a small
      increase and explains decisions through marginal comparison.
  explanation:
    zh-CN: 边际主义用“再增加一单位”带来的收益和成本解释选择，推动价值理论从总量与生产成本转向边际评价。
    en: Marginalism explains choice through the benefit and cost of one more unit,
      shifting value theory from totals and production cost toward evaluation at
      the margin.
- id: u1-37-utility-marginalism-mcq-1
  knowledgePointId: u1-37-utility-marginalism
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“效用理论与边际主义”？
    en: Which statement best captures “Utility theory and marginalism”?
  options:
    - id: a
      zh-CN: 它只描述个人偏好，与资源、制度或社会结果无关。
      en: It concerns personal preference only and has no connection to resources,
        institutions, or social outcomes.
    - id: b
      zh-CN: 边际主义用“再增加一单位”带来的收益和成本解释选择，推动价值理论从总量与生产成本转向边际评价。
      en: Marginalism explains choice through the benefit and cost of one more unit,
        shifting value theory from totals and production cost toward evaluation
        at the margin.
    - id: c
      zh-CN: 它意味着同一种经济结果在任何条件下都会自动出现。
      en: It means the same economic outcome must arise automatically under every set
        of conditions.
    - id: d
      zh-CN: 它是一项只适用于高收入经济体的会计规则。
      en: It is an accounting rule that applies only to high-income economies.
  correctOptionId: b
  explanation:
    zh-CN: 效用理论把消费满足作为选择依据；边际主义关注一个变量微小增加所带来的额外效用、产出或成本，并以边际比较解释决策。
    en: Utility theory treats satisfaction from consumption as a basis for choice.
      Marginalism studies the extra utility, output, or cost created by a small
      increase and explains decisions through marginal comparison.
