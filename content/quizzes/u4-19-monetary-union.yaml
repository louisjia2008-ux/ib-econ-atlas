- id: u4-19-monetary-union-flash-1
  knowledgePointId: u4-19-monetary-union
  type: flashcard
  prompt:
    zh-CN: 解释“货币联盟的含义”，并说明一个关键条件。
    en: Explain The meaning of monetary union and state one important condition.
  answer:
    zh-CN: 货币联盟采用共同货币及共同货币政策，成员不再各自发行可独立调整汇率的货币。收益、代价与非对称冲击评价属于 HL。
    en: A monetary union uses a shared currency and monetary policy; members no
      longer issue separate currencies with independently adjustable exchange
      rates. Evaluating benefits, costs and asymmetric shocks is HL.
  explanation:
    zh-CN: 自由贸易区不等于货币联盟，共同货币也不自动意味着财政统一。
    en: A free trade area is not a monetary union; a common currency does not
      automatically mean fiscal unification.
- id: u4-19-monetary-union-mcq-1
  knowledgePointId: u4-19-monetary-union
  type: mcq
  prompt:
    zh-CN: 货币联盟的识别特征是什么？
    en: What identifies a monetary union?
  options:
    - id: a
      zh-CN: 仅内部免关税
      en: Internal tariff removal alone
    - id: b
      zh-CN: 仅共同对外关税
      en: A common external tariff alone
    - id: c
      zh-CN: 共同货币与共同货币政策
      en: A shared currency and monetary policy
    - id: d
      zh-CN: 仅人口相同
      en: Identical populations alone
  correctOptionId: c
  explanation:
    zh-CN: 共同货币与共同货币政策。 成员采用共同货币；共同机构制定货币政策；区别于只有内部自由贸易的贸易区
      自由贸易区不等于货币联盟，共同货币也不自动意味着财政统一。
    en: A shared currency and monetary policy. Members adopt one currency; a shared
      institution sets monetary policy; distinguish this from an area with
      internal free trade only A free trade area is not a monetary union; a
      common currency does not automatically mean fiscal unification.
