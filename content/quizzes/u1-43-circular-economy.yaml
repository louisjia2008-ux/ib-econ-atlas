- id: u1-43-circular-economy-short-1
  knowledgePointId: u1-43-circular-economy
  type: short-answer
  prompt:
    zh-CN: 简要解释“相互依存与循环经济”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “Interdependence and the circular economy”, including one
      causal mechanism and one important implication.
  modelAnswer:
    zh-CN: 相互依存与循环经济：循环经济是一种设计和组织生产消费的框架，目标是减少资源开采和废弃物，在产品、部件和材料层级维持价值，并促进自然系统恢复。
      线性生产开采资源并产生废弃物；设计减少材料并延长产品寿命；维修、再用、再制造和回收形成闭环；较低原生资源需求减轻生态压力并改变商业模式
      经济活动依赖社会与自然系统。
    en: "Interdependence and the circular economy: A circular economy is a framework
      for designing and organising production and consumption to reduce
      extraction and waste, retain value in products, components, and materials,
      and support regeneration of natural systems. Linear production extracts
      resources and generates waste; Design reduces material use and extends
      product life; Repair, reuse, remanufacture, and recycling create loops;
      Lower primary-resource demand reduces ecological pressure and changes
      business models Economic activity depends on social and natural systems."
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
        zh-CN:
          - 相互依存与循环经济
          - 循环性
          - 闭环经济
          - 经济社会环境相互依存
        en:
          - Interdependence and the circular economy
          - circularity
          - closed-loop economy
          - economy society environment interdependence
    - id: mechanism
      label:
        zh-CN: 因果机制
        en: Causal mechanism
      alternatives:
        zh-CN:
          - 线性生产开采资源并产生废弃物
          - 设计减少材料并延长产品寿命
        en:
          - Linear production extracts resources and generates waste
          - Design reduces material use and extends product life
    - id: implication
      label:
        zh-CN: 重要含义
        en: Important implication
      alternatives:
        zh-CN:
          - 经济活动依赖社会与自然系统。
          - 循环策略在废弃前保留产品和材料价值。
        en:
          - Economic activity depends on social and natural systems.
          - Circular strategies preserve product and material value before
            disposal.
  explanation:
    zh-CN: 系统按核心概念、因果机制和重要含义三个关键词组计算覆盖率；你可以查看依据并手动修正最终判定。
    en: Coverage is calculated across the core concept, causal mechanism, and
      implication groups; you can inspect and override the final judgement.
