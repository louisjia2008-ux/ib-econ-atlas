- id: u4-10-export-subsidy-flash-1
  knowledgePointId: u4-10-export-subsidy
  type: flashcard
  prompt:
    zh-CN: 解释“出口补贴”，并说明一个关键条件。
    en: Explain Export subsidies and state one important condition.
  answer:
    zh-CN: 出口补贴按出口量支付，可能提高本国价格并扩大出口，财政支出和国内消费损失影响福利。
    en: An export subsidy pays per exported unit and can raise the domestic price
      and exports; fiscal costs and domestic consumption losses affect welfare.
  explanation:
    zh-CN: 出口增加不是净福利增加；补贴也可能引发贸易争端，具体规则须核验。
    en: More exports do not establish a welfare gain; subsidies can also trigger
      trade disputes, whose specific rules require verification.
- id: u4-10-export-subsidy-mcq-1
  knowledgePointId: u4-10-export-subsidy
  type: mcq
  prompt:
    zh-CN: 出口补贴一定改善本国净福利吗？
    en: Does an export subsidy necessarily improve home welfare?
  options:
    - id: a
      zh-CN: 是，只要出口增加
      en: Yes, whenever exports rise
    - id: b
      zh-CN: 不，财政成本与消费者损失也需计算
      en: No; fiscal costs and consumer losses also matter
    - id: c
      zh-CN: 是，因为不存在财政成本
      en: Yes, because there is no fiscal cost
    - id: d
      zh-CN: 是，因为消费者价必下降
      en: Yes, because consumer price must fall
  correctOptionId: b
  explanation:
    zh-CN: 不，财政成本与消费者损失也需计算。 出口每单位回报提高；生产者转向出口直到国内价调整；国内生产增加消费下降
      出口增加不是净福利增加；补贴也可能引发贸易争端，具体规则须核验。
    en: No; fiscal costs and consumer losses also matter. Returns per exported unit
      rise; producers divert sales until domestic price adjusts; domestic output
      rises and consumption falls More exports do not establish a welfare gain;
      subsidies can also trigger trade disputes, whose specific rules require
      verification.
- id: u4-10-export-subsidy-short-1
  knowledgePointId: u4-10-export-subsidy
  type: short-answer
  prompt:
    zh-CN: 解释出口补贴的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Export subsidies and apply it to an example of your
      own.
  modelAnswer:
    zh-CN: 出口补贴按出口量支付，可能提高本国价格并扩大出口，财政支出和国内消费损失影响福利。
      出口每单位回报提高；生产者转向出口直到国内价调整；国内生产增加消费下降
      原创假设：小国补贴每单位出口，可自由转售时生产者倾向出口直到国内价也上升；国内生产增加、消费下降、出口扩大，但财政与消费者承受成本。计算财政支出属于
      HL。
    en: "An export subsidy pays per exported unit and can raise the domestic price
      and exports; fiscal costs and domestic consumption losses affect welfare.
      Returns per exported unit rise; producers divert sales until domestic
      price adjusts; domestic output rises and consumption falls Hypothetical
      scenario: a per-unit export subsidy encourages exporting until domestic
      price also rises under arbitrage. Domestic output rises, consumption falls
      and exports expand, at fiscal and consumer cost. Numerical fiscal
      calculations are HL."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 出口
        en: exports
      alternatives:
        zh-CN:
          - 出口
          - 出口每单位回报提高
        en:
          - exports
          - Returns per exported unit rise
    - id: mechanism-2
      label:
        zh-CN: 补贴
        en: subsidy
      alternatives:
        zh-CN:
          - 补贴
          - 生产者转向出口直到国内价调整
        en:
          - subsidy
          - producers divert sales until domestic price adjusts
    - id: mechanism-3
      label:
        zh-CN: 消费
        en: consumption
      alternatives:
        zh-CN:
          - 消费
          - 国内生产增加消费下降
        en:
          - consumption
          - domestic output rises and consumption falls
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
- id: u4-10-export-subsidy-mcq-hl-1
  knowledgePointId: u4-10-export-subsidy
  type: mcq
  level: hl
  prompt:
    zh-CN: 出口补贴 2、出口 50，财政支出多少？
    en: An export subsidy of two on fifty exports costs how much?
  options:
    - id: a
      zh-CN: "52"
      en: "52"
    - id: b
      zh-CN: "48"
      en: "48"
    - id: c
      zh-CN: "100"
      en: "100"
    - id: d
      zh-CN: 必然没有成本
      en: Necessarily no cost
  correctOptionId: c
  explanation:
    zh-CN: 100。 2 × 50 = 100
    en: 100. 2 × 50 = 100
