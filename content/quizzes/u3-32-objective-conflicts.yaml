- id: u3-32-objective-conflicts-flash-1
  knowledgePointId: u3-32-objective-conflicts
  type: flashcard
  prompt:
    zh-CN: 解释“宏观目标的冲突与协同”，并说明一个关键条件。
    en: Explain Conflicts and complementarities among objectives and state one
      important condition.
  answer:
    zh-CN: 增长、低失业、价格稳定、公平、可持续性与债务目标可能冲突，也可能因生产率改善等共同推进；权衡依赖起点、冲击和时间。
    en: Growth, low unemployment, price stability, equity, sustainability and debt
      objectives can conflict or complement one another. Trade-offs depend on
      starting conditions, shocks and time horizons.
  explanation:
    zh-CN: 目标之间的关系不是固定不变的，评价应写明条件。
    en: Relationships between objectives are not fixed; state the conditions in
      evaluation.
- id: u3-32-objective-conflicts-mcq-1
  knowledgePointId: u3-32-objective-conflicts
  type: mcq
  prompt:
    zh-CN: 哪种政策更可能同时提高潜力并缓解长期物价压力？
    en: Which may raise capacity while easing long-run price pressure?
  options:
    - id: a
      zh-CN: 满产时只增加名义需求
      en: Only more nominal demand at capacity
    - id: b
      zh-CN: 永久降低全部技能
      en: Permanently reducing skills
    - id: c
      zh-CN: 任意放弃成本评估
      en: Abandoning cost assessment
    - id: d
      zh-CN: 有效提高生产率的投资
      en: Effective productivity-enhancing investment
  correctOptionId: d
  explanation:
    zh-CN: 有效提高生产率的投资。 明确政策作用渠道；辨认各目标受影响方向；比较短期权衡与长期协同 目标之间的关系不是固定不变的，评价应写明条件。
    en: Effective productivity-enhancing investment. Specify the policy channel;
      identify effects on each objective; compare short-run trade-offs with
      long-run complementarities Relationships between objectives are not fixed;
      state the conditions in evaluation.
- id: u3-32-objective-conflicts-short-1
  knowledgePointId: u3-32-objective-conflicts
  type: short-answer
  prompt:
    zh-CN: 解释宏观目标的冲突与协同的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Conflicts and complementarities among objectives
      and apply it to an example of your own.
  modelAnswer:
    zh-CN: 增长、低失业、价格稳定、公平、可持续性与债务目标可能冲突，也可能因生产率改善等共同推进；权衡依赖起点、冲击和时间。
      明确政策作用渠道；辨认各目标受影响方向；比较短期权衡与长期协同
      原创例：扩张财政在负缺口时可增加就业，在满产时却更易推升物价。教育支出增加短期赤字，但若有效提高生产率，也可能扩大长期税基。不能仅凭一个目标改善就判定政策成功。
    en: "Growth, low unemployment, price stability, equity, sustainability and debt
      objectives can conflict or complement one another. Trade-offs depend on
      starting conditions, shocks and time horizons. Specify the policy channel;
      identify effects on each objective; compare short-run trade-offs with
      long-run complementarities Illustrative example: fiscal expansion can
      raise employment in a negative gap but more readily raise prices at
      capacity. Education spending increases the short-run deficit yet may
      expand the future tax base if it improves productivity. One improved
      objective alone does not establish success."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 目标
        en: objectives
      alternatives:
        zh-CN:
          - 目标
          - 明确政策作用渠道
        en:
          - objectives
          - Specify the policy channel
    - id: mechanism-2
      label:
        zh-CN: 短期
        en: short run
      alternatives:
        zh-CN:
          - 短期
          - 辨认各目标受影响方向
        en:
          - short run
          - identify effects on each objective
    - id: mechanism-3
      label:
        zh-CN: 生产率
        en: productivity
      alternatives:
        zh-CN:
          - 生产率
          - 比较短期权衡与长期协同
        en:
          - productivity
          - compare short-run trade-offs with long-run complementarities
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
