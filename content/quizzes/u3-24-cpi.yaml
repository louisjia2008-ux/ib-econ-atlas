- id: u3-24-cpi-flash-1
  knowledgePointId: u3-24-cpi
  type: flashcard
  prompt:
    zh-CN: 解释“CPI 与通胀率计算”，并说明一个关键条件。
    en: Explain CPI and inflation calculations and state one important condition.
  answer:
    zh-CN: CPI 用加权消费篮子衡量消费价格变化；通胀率=(本期指数−上期指数)/上期指数×100。权重和篮子影响其代表性。
    en: CPI measures consumer-price changes using a weighted basket.
      Inflation=(current index−previous index)/previous index×100. Weights and
      basket composition affect representativeness.
  explanation:
    zh-CN: 指数增加的点数与百分比涨幅不是同一数值。
    en: The index-point increase is not the same as the percentage increase.
- id: u3-24-cpi-mcq-1
  knowledgePointId: u3-24-cpi
  type: mcq
  prompt:
    zh-CN: CPI 从 150 到 156，通胀率多少？
    en: CPI rises from 150 to 156. What is inflation?
  options:
    - id: a
      zh-CN: 6%
      en: 6%
    - id: b
      zh-CN: 56%
      en: 56%
    - id: c
      zh-CN: 104%
      en: 104%
    - id: d
      zh-CN: 4%
      en: 4%
  correctOptionId: d
  explanation:
    zh-CN: 4%。 原创例：CPI 从 120 升至 126，通胀率为 5%，不是
      6%。不同家庭的能源或食品支出占比不同，实际感受可能不同；替代、新产品与质量变化也使固定篮子存在局限。 指数增加的点数与百分比涨幅不是同一数值。
    en: "4%. Illustrative example: CPI rises from 120 to 126, so inflation is 5%,
      not 6%. Households with different food and energy weights experience
      different changes. Substitution, new products and quality changes also
      limit a fixed basket. The index-point increase is not the same as the
      percentage increase."
- id: u3-24-cpi-short-1
  knowledgePointId: u3-24-cpi
  type: short-answer
  prompt:
    zh-CN: 解释CPI 与通胀率计算的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of CPI and inflation calculations and apply it to an
      example of your own.
  modelAnswer:
    zh-CN: CPI 用加权消费篮子衡量消费价格变化；通胀率=(本期指数−上期指数)/上期指数×100。权重和篮子影响其代表性。
      选定代表性商品及支出权重；计算篮子成本与指数；用相邻期指数变化计算通胀 原创例：CPI 从 120 升至 126，通胀率为 5%，不是
      6%。不同家庭的能源或食品支出占比不同，实际感受可能不同；替代、新产品与质量变化也使固定篮子存在局限。
    en: "CPI measures consumer-price changes using a weighted basket.
      Inflation=(current index−previous index)/previous index×100. Weights and
      basket composition affect representativeness. Select representative goods
      and expenditure weights; compute basket cost and the index; calculate
      inflation from successive index changes Illustrative example: CPI rises
      from 120 to 126, so inflation is 5%, not 6%. Households with different
      food and energy weights experience different changes. Substitution, new
      products and quality changes also limit a fixed basket."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 权重
        en: weights
      alternatives:
        zh-CN:
          - 权重
          - 选定代表性商品及支出权重
        en:
          - weights
          - Select representative goods and expenditure weights
    - id: mechanism-2
      label:
        zh-CN: 指数
        en: index
      alternatives:
        zh-CN:
          - 指数
          - 计算篮子成本与指数
        en:
          - index
          - compute basket cost and the index
    - id: mechanism-3
      label:
        zh-CN: 百分比
        en: percentage
      alternatives:
        zh-CN:
          - 百分比
          - 用相邻期指数变化计算通胀
        en:
          - percentage
          - calculate inflation from successive index changes
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
