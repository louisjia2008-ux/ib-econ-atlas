- id: u3-37-progressive-tax-flash-1
  knowledgePointId: u3-37-progressive-tax
  type: flashcard
  prompt:
    zh-CN: 解释“累进税、转移支付与可支配收入”，并说明一个关键条件。
    en: Explain Progressive taxes, transfers and disposable income and state one
      important condition.
  answer:
    zh-CN: 累进税的平均税率随收入提高；边际税率适用于新增收入，平均税率是税额/总收入。可支配收入为收入减直接税加转移。
    en: Under progressive taxation the average tax rate rises with income. The
      marginal rate applies to additional income; the average rate is total
      tax/income. Disposable income subtracts direct taxes and adds transfers.
  explanation:
    zh-CN: 最高边际税率不应直接乘以全部收入。
    en: Do not apply the highest marginal rate to all income.
- id: u3-37-progressive-tax-mcq-1
  knowledgePointId: u3-37-progressive-tax
  type: mcq
  prompt:
    zh-CN: 哪种情况定义了累进所得税？
    en: What defines a progressive income tax?
  options:
    - id: a
      zh-CN: 平均税率随收入上升
      en: The average tax rate rises with income
    - id: b
      zh-CN: 人人支付相同税额
      en: Everyone pays the same tax amount
    - id: c
      zh-CN: 平均税率随收入下降
      en: The average tax rate falls with income
    - id: d
      zh-CN: 所有收入始终按同一比例征税
      en: All income is always taxed at one constant rate
  correctOptionId: a
  explanation:
    zh-CN: 平均税率随收入上升。 确定各税档适用收入；分段计算税额而非全部收入乘最高税率；用转移和税收比较最终购买能力 最高边际税率不应直接乘以全部收入。
    en: The average tax rate rises with income. Identify income within each bracket;
      calculate tax progressively rather than applying the top rate to all
      income; compare purchasing power after taxes and transfers Do not apply
      the highest marginal rate to all income.
- id: u3-37-progressive-tax-short-1
  knowledgePointId: u3-37-progressive-tax
  type: short-answer
  prompt:
    zh-CN: 解释累进税、转移支付与可支配收入的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Progressive taxes, transfers and disposable income
      and apply it to an example of your own.
  modelAnswer:
    zh-CN: 累进税的平均税率随收入提高；边际税率适用于新增收入，平均税率是税额/总收入。可支配收入为收入减直接税加转移。
      确定各税档适用收入；分段计算税额而非全部收入乘最高税率；用转移和税收比较最终购买能力
      原创例：边际税率只适用于新增收入，不应把最高档税率乘全部收入。累进税意味着平均税率随收入上升，定向转移支付则增加合资格家庭的可支配收入。税额和平均税率的数值计算属于
      HL。
    en: "Under progressive taxation the average tax rate rises with income. The
      marginal rate applies to additional income; the average rate is total
      tax/income. Disposable income subtracts direct taxes and adds transfers.
      Identify income within each bracket; calculate tax progressively rather
      than applying the top rate to all income; compare purchasing power after
      taxes and transfers Illustrative example: a marginal rate applies to
      additional income, not automatically all income. Under progressive
      taxation the average rate rises with income; targeted transfers add to
      eligible households’ disposable income. Numerical tax and average-rate
      calculations are HL."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 平均税率
        en: average rate
      alternatives:
        zh-CN:
          - 平均税率
          - 确定各税档适用收入
        en:
          - average rate
          - Identify income within each bracket
    - id: mechanism-2
      label:
        zh-CN: 边际税率
        en: marginal rate
      alternatives:
        zh-CN:
          - 边际税率
          - 分段计算税额而非全部收入乘最高税率
        en:
          - marginal rate
          - calculate tax progressively rather than applying the top rate to all
            income
    - id: mechanism-3
      label:
        zh-CN: 可支配收入
        en: disposable income
      alternatives:
        zh-CN:
          - 可支配收入
          - 用转移和税收比较最终购买能力
        en:
          - disposable income
          - compare purchasing power after taxes and transfers
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
- id: u3-37-progressive-tax-mcq-hl-1
  knowledgePointId: u3-37-progressive-tax
  type: mcq
  level: hl
  prompt:
    zh-CN: 收入 300、税额 45，平均税率多少？
    en: Income is 300 and tax 45. What is the average tax rate?
  options:
    - id: a
      zh-CN: 45%
      en: 45%
    - id: b
      zh-CN: 15%
      en: 15%
    - id: c
      zh-CN: 6.67%
      en: 6.67%
    - id: d
      zh-CN: 必等于最高边际税率
      en: Must equal the top marginal rate
  correctOptionId: b
  explanation:
    zh-CN: 15%。 45 / 300 × 100 = 15%
    en: 15%. 45 / 300 × 100 = 15%
