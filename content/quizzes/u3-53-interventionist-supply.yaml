- id: u3-53-interventionist-supply-flash-1
  knowledgePointId: u3-53-interventionist-supply
  type: flashcard
  prompt:
    zh-CN: 解释“干预型供给侧政策”，并说明一个关键条件。
    en: Explain Interventionist supply-side policies and state one important
      condition.
  answer:
    zh-CN: 教育、培训、医疗、基础设施和研发支持旨在提升生产率与潜在产出，常针对外部收益、信息或协调失灵。
    en: Education, training, health, infrastructure and research support aim to
      raise productivity and potential output, often addressing external
      benefits, information or coordination failures.
  explanation:
    zh-CN: 投入金额不是生产率改善的充分证据。
    en: Spending amounts are not sufficient evidence of productivity gains.
- id: u3-53-interventionist-supply-mcq-1
  knowledgePointId: u3-53-interventionist-supply
  type: mcq
  prompt:
    zh-CN: 教育支出提高 LRAS 的关键渠道？
    en: The key channel through which education spending raises LRAS?
  options:
    - id: a
      zh-CN: 提高技能与劳动生产率
      en: Improved skills and labour productivity
    - id: b
      zh-CN: 仅仅提高当期 G 的账面值
      en: Only a higher accounting value of current G
    - id: c
      zh-CN: 保证立即消除贫困
      en: Guaranteed immediate elimination of poverty
    - id: d
      zh-CN: 自动使所有物价下降
      en: Automatically lowers every price
  correctOptionId: a
  explanation:
    zh-CN: 提高技能与劳动生产率。
      原创例：针对实际岗位需求的培训可减少技能错配，但没有雇主需求的课程未必增加就业。教育支出当期可能提高总需求，只有改善技能和生产率时才支持长期总供给，且往往需要较长时间。
      投入金额不是生产率改善的充分证据。
    en: "Improved skills and labour productivity. Illustrative example: training
      aligned with actual vacancies may reduce mismatch, whereas courses without
      employer demand may not increase employment. Education spending can raise
      current demand, but supports long-run supply only if skills and
      productivity improve, often after a long lag. Spending amounts are not
      sufficient evidence of productivity gains."
- id: u3-53-interventionist-supply-short-1
  knowledgePointId: u3-53-interventionist-supply
  type: short-answer
  prompt:
    zh-CN: 解释干预型供给侧政策的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Interventionist supply-side policies and apply it
      to an example of your own.
  modelAnswer:
    zh-CN: 教育、培训、医疗、基础设施和研发支持旨在提升生产率与潜在产出，常针对外部收益、信息或协调失灵。
      识别技能健康或资本瓶颈；公共服务和投资改善生产条件；生产率与潜在产出可能长期增加
      原创例：针对实际岗位需求的培训可减少技能错配，但没有雇主需求的课程未必增加就业。教育支出当期可能提高总需求，只有改善技能和生产率时才支持长期总供给，且往往需要较长时间。
    en: "Education, training, health, infrastructure and research support aim to
      raise productivity and potential output, often addressing external
      benefits, information or coordination failures. Identify skill, health or
      capital bottlenecks; public services and investment improve production
      conditions; productivity and potential output may increase over time
      Illustrative example: training aligned with actual vacancies may reduce
      mismatch, whereas courses without employer demand may not increase
      employment. Education spending can raise current demand, but supports
      long-run supply only if skills and productivity improve, often after a
      long lag."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 瓶颈
        en: bottlenecks
      alternatives:
        zh-CN:
          - 瓶颈
          - 识别技能健康或资本瓶颈
        en:
          - bottlenecks
          - Identify skill, health or capital bottlenecks
    - id: mechanism-2
      label:
        zh-CN: 投资
        en: investment
      alternatives:
        zh-CN:
          - 投资
          - 公共服务和投资改善生产条件
        en:
          - investment
          - public services and investment improve production conditions
    - id: mechanism-3
      label:
        zh-CN: 潜在产出
        en: potential output
      alternatives:
        zh-CN:
          - 潜在产出
          - 生产率与潜在产出可能长期增加
        en:
          - potential output
          - productivity and potential output may increase over time
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
