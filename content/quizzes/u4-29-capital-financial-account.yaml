- id: u4-29-capital-financial-account-flash-1
  knowledgePointId: u4-29-capital-financial-account
  type: flashcard
  prompt:
    zh-CN: 解释“资本账户与金融账户”，并说明一个关键条件。
    en: Explain Capital and financial accounts and state one important condition.
  answer:
    zh-CN: 资本账户记录资本转移及非生产非金融资产交易；金融账户记录跨境金融资产与负债交易，包括直接投资、证券投资、其他投资和储备。
    en: The capital account records capital transfers and non-produced non-financial
      assets. The financial account records cross-border asset and liability
      transactions, including direct, portfolio, other investment and reserves.
  explanation:
    zh-CN: 日常所说资本流入大多属于金融账户，不应把资本账户当作所有投资的总称。
    en: Most everyday capital inflows belong to the financial account; the capital
      account is not a catch-all for investment.
