- id: u1-08-economic-wellbeing-flash-1
  knowledgePointId: u1-08-economic-wellbeing
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“经济福祉”。
    en: Without notes, explain “Economic well-being” in your own words.
  answer:
    zh-CN: 经济福祉是个人或群体通过收入、消费、公共服务、健康、教育、安全与选择机会满足需要并改善生活质量的程度。
    en: Economic well-being is the extent to which people or groups can meet needs
      and improve quality of life through income, consumption, public services,
      health, education, security, and genuine opportunities.
  explanation:
    zh-CN: 经济福祉关心人能否过有保障、有选择的生活，收入重要但不是唯一决定因素。
    en: Economic well-being concerns whether people can live secure lives with
      meaningful choices; income matters, but it is not the whole outcome.
- id: u1-08-economic-wellbeing-mcq-1
  knowledgePointId: u1-08-economic-wellbeing
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“经济福祉”？
    en: Which statement best captures “Economic well-being”?
  options:
    - id: a
      zh-CN: 经济福祉关心人能否过有保障、有选择的生活，收入重要但不是唯一决定因素。
      en: Economic well-being concerns whether people can live secure lives with
        meaningful choices; income matters, but it is not the whole outcome.
    - id: b
      zh-CN: 它只描述个人偏好，与资源、制度或社会结果无关。
      en: It concerns personal preference only and has no connection to resources,
        institutions, or social outcomes.
    - id: c
      zh-CN: 它意味着同一种经济结果在任何条件下都会自动出现。
      en: It means the same economic outcome must arise automatically under every set
        of conditions.
    - id: d
      zh-CN: 它是一项只适用于高收入经济体的会计规则。
      en: It is an accounting rule that applies only to high-income economies.
  correctOptionId: a
  explanation:
    zh-CN: 经济福祉是个人或群体通过收入、消费、公共服务、健康、教育、安全与选择机会满足需要并改善生活质量的程度。
    en: Economic well-being is the extent to which people or groups can meet needs
      and improve quality of life through income, consumption, public services,
      health, education, security, and genuine opportunities.
