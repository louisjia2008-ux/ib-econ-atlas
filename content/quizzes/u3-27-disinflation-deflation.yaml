- id: u3-27-disinflation-deflation-flash-1
  knowledgePointId: u3-27-disinflation-deflation
  type: flashcard
  prompt:
    zh-CN: 解释“通胀放缓、通缩与实际债务”，并说明一个关键条件。
    en: Explain Disinflation, deflation and real debt and state one important
      condition.
  answer:
    zh-CN: 通胀放缓是物价上涨速度下降；通缩是总体价格水平下降。意外通胀或通缩可改变固定名义债务的实际负担。
    en: Disinflation is slower price growth; deflation is a falling general price
      level. Unexpected inflation or deflation can alter the real burden of
      fixed nominal debt.
  explanation:
    zh-CN: 较低通胀率不等于较低价格水平。
    en: A lower inflation rate does not mean a lower price level.
- id: u3-27-disinflation-deflation-mcq-1
  knowledgePointId: u3-27-disinflation-deflation
  type: mcq
  prompt:
    zh-CN: 通胀从 6% 降至 2%，最准确的描述是什么？
    en: Inflation falls from 6% to 2%. What is the most accurate description?
  options:
    - id: a
      zh-CN: 价格下降 4%
      en: Prices fall 4%
    - id: b
      zh-CN: 必然通缩
      en: Deflation necessarily
    - id: c
      zh-CN: 通胀放缓，价格仍上涨
      en: Disinflation; prices still rise
    - id: d
      zh-CN: 实际产出下降 2%
      en: Real output falls 2%
  correctOptionId: c
  explanation:
    zh-CN: 通胀放缓，价格仍上涨。 原创例：通胀率由 8% 到 3% 表示仍在涨价；由 3% 到 -1%
      才出现通缩。若工资和收入随物价下降，固定还款负担可能更重。由生产率提高引起的降价与需求崩塌造成的通缩，政策含义不同。 较低通胀率不等于较低价格水平。
    en: "Disinflation; prices still rise. Illustrative example: inflation falling
      from 8% to 3% still means prices rise; moving from 3% to -1% is deflation.
      Fixed repayments may become harder when wages and incomes fall.
      Productivity-driven price falls differ from demand-collapse deflation. A
      lower inflation rate does not mean a lower price level."
- id: u3-27-disinflation-deflation-short-1
  knowledgePointId: u3-27-disinflation-deflation
  type: short-answer
  prompt:
    zh-CN: 解释通胀放缓、通缩与实际债务的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Disinflation, deflation and real debt and apply it
      to an example of your own.
  modelAnswer:
    zh-CN: 通胀放缓是物价上涨速度下降；通缩是总体价格水平下降。意外通胀或通缩可改变固定名义债务的实际负担。
      区分物价水平与其变化率；通缩提高给定名义金额的购买力；实际债务与延迟支出可能加重需求疲弱 原创例：通胀率由 8% 到 3% 表示仍在涨价；由 3%
      到 -1% 才出现通缩。若工资和收入随物价下降，固定还款负担可能更重。由生产率提高引起的降价与需求崩塌造成的通缩，政策含义不同。
    en: "Disinflation is slower price growth; deflation is a falling general price
      level. Unexpected inflation or deflation can alter the real burden of
      fixed nominal debt. Separate the price level from its rate of change;
      deflation raises the purchasing power of a fixed nominal amount; real debt
      and delayed spending may weaken demand further Illustrative example:
      inflation falling from 8% to 3% still means prices rise; moving from 3% to
      -1% is deflation. Fixed repayments may become harder when wages and
      incomes fall. Productivity-driven price falls differ from demand-collapse
      deflation."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 通胀放缓
        en: disinflation
      alternatives:
        zh-CN:
          - 通胀放缓
          - 区分物价水平与其变化率
        en:
          - disinflation
          - Separate the price level from its rate of change
    - id: mechanism-2
      label:
        zh-CN: 通缩
        en: deflation
      alternatives:
        zh-CN:
          - 通缩
          - 通缩提高给定名义金额的购买力
        en:
          - deflation
          - deflation raises the purchasing power of a fixed nominal amount
    - id: mechanism-3
      label:
        zh-CN: 实际债务
        en: real debt
      alternatives:
        zh-CN:
          - 实际债务
          - 实际债务与延迟支出可能加重需求疲弱
        en:
          - real debt
          - real debt and delayed spending may weaken demand further
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
