- id: u1-23-mixed-economy-flash-1
  knowledgePointId: u1-23-mixed-economy
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“混合经济”。
    en: Without notes, explain “The mixed economy” in your own words.
  answer:
    zh-CN: 混合经济是私人市场和公共部门共同拥有资源并共同决定生产、配置和分配的经济制度。
    en: A mixed economy is a system in which private markets and the public sector
      both own resources and share responsibility for production, allocation,
      and distribution.
  explanation:
    zh-CN: 混合经济把市场配置与政府规则、再分配和公共供给结合起来，关键问题是两者边界如何设计。
    en: A mixed economy combines market allocation with public rules,
      redistribution, and provision; the central issue is how the boundary is
      designed.
- id: u1-23-mixed-economy-mcq-1
  knowledgePointId: u1-23-mixed-economy
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“混合经济”？
    en: Which statement best captures “The mixed economy”?
  options:
    - id: a
      zh-CN: 它只描述个人偏好，与资源、制度或社会结果无关。
      en: It concerns personal preference only and has no connection to resources,
        institutions, or social outcomes.
    - id: b
      zh-CN: 它意味着同一种经济结果在任何条件下都会自动出现。
      en: It means the same economic outcome must arise automatically under every set
        of conditions.
    - id: c
      zh-CN: 它是一项只适用于高收入经济体的会计规则。
      en: It is an accounting rule that applies only to high-income economies.
    - id: d
      zh-CN: 混合经济把市场配置与政府规则、再分配和公共供给结合起来，关键问题是两者边界如何设计。
      en: A mixed economy combines market allocation with public rules,
        redistribution, and provision; the central issue is how the boundary is
        designed.
  correctOptionId: d
  explanation:
    zh-CN: 混合经济是私人市场和公共部门共同拥有资源并共同决定生产、配置和分配的经济制度。
    en: A mixed economy is a system in which private markets and the public sector
      both own resources and share responsibility for production, allocation,
      and distribution.
