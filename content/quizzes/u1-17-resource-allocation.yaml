- id: u1-17-resource-allocation-flash-1
  knowledgePointId: u1-17-resource-allocation
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“资源配置与重新配置”。
    en: Without notes, explain “Resource allocation and reallocation” in your own
      words.
  answer:
    zh-CN: 资源配置是把生产要素分配到不同用途的过程；重新配置是改变既有用途，过度配置和不足配置分别表示相对于社会最优水平投入过多或过少。
    en: Resource allocation is the assignment of productive factors to different
      uses. Reallocation changes those uses, while overallocation and
      underallocation mean that too many or too few resources are devoted to an
      activity relative to the social optimum.
  explanation:
    zh-CN: 资源配置决定生产要素流向何处；价格、政策或偏好变化会触发重新配置，并可纠正过度或不足配置。
    en: Allocation directs factors of production; changes in prices, policy, or
      preferences cause reallocation and may address over- or underallocation.
- id: u1-17-resource-allocation-mcq-1
  knowledgePointId: u1-17-resource-allocation
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“资源配置与重新配置”？
    en: Which statement best captures “Resource allocation and reallocation”?
  options:
    - id: a
      zh-CN: 它只描述个人偏好，与资源、制度或社会结果无关。
      en: It concerns personal preference only and has no connection to resources,
        institutions, or social outcomes.
    - id: b
      zh-CN: 资源配置决定生产要素流向何处；价格、政策或偏好变化会触发重新配置，并可纠正过度或不足配置。
      en: Allocation directs factors of production; changes in prices, policy, or
        preferences cause reallocation and may address over- or underallocation.
    - id: c
      zh-CN: 它意味着同一种经济结果在任何条件下都会自动出现。
      en: It means the same economic outcome must arise automatically under every set
        of conditions.
    - id: d
      zh-CN: 它是一项只适用于高收入经济体的会计规则。
      en: It is an accounting rule that applies only to high-income economies.
  correctOptionId: b
  explanation:
    zh-CN: 资源配置是把生产要素分配到不同用途的过程；重新配置是改变既有用途，过度配置和不足配置分别表示相对于社会最优水平投入过多或过少。
    en: Resource allocation is the assignment of productive factors to different
      uses. Reallocation changes those uses, while overallocation and
      underallocation mean that too many or too few resources are devoted to an
      activity relative to the social optimum.
