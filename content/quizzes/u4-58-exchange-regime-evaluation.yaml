          - Regimes alter adjustment channels
    - id: mechanism-2
      label:
        zh-CN: 储备
        en: reserves
      alternatives:
        zh-CN:
          - 储备
          - 固定制需捍卫平价
        en:
          - reserves
          - pegs need parity defence
    - id: mechanism-3
      label:
        zh-CN: 自主性
        en: autonomy
      alternatives:
        zh-CN:
          - 自主性
          - 浮动制让汇率吸收部分冲击
        en:
          - autonomy
          - floating lets exchange rates absorb some shocks
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
