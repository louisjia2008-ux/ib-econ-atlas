- id: u4-58-exchange-regime-evaluation-flash-1
  knowledgePointId: u4-58-exchange-regime-evaluation
  type: flashcard
  prompt:
    zh-CN: 解释“固定与浮动汇率的评价”，并说明一个关键条件。
    en: Explain Evaluating fixed and floating exchange rates and state one important
      condition.
  answer:
    zh-CN: 固定汇率可减少名义汇率不确定性但需要可信政策与储备；浮动允许外部调整与较大政策自主性，却可能波动并传递进口通胀。
    en: Fixed rates can reduce nominal exchange uncertainty but need credible policy
      and reserves. Floating permits external adjustment and more policy
      autonomy, while risking volatility and imported inflation.
  explanation:
    zh-CN: 没有对所有经济体都最优的汇率制度；管理浮动也不保证没有波动。
    en: No regime is best for every economy; managed floating does not guarantee
      zero volatility.
- id: u4-58-exchange-regime-evaluation-mcq-1
  knowledgePointId: u4-58-exchange-regime-evaluation
  type: mcq
  prompt:
    zh-CN: 评价汇率制度时最合理的做法是什么？
    en: What best evaluates an exchange regime?
  options:
    - id: a
      zh-CN: 只按制度名称排名
      en: Rank by regime name alone
    - id: b
      zh-CN: 比较开放度、储备、冲击与政策自主性
      en: Compare openness, reserves, shocks and policy autonomy
    - id: c
      zh-CN: 假设储备无限
      en: Assume unlimited reserves
    - id: d
      zh-CN: 忽略进口价格
      en: Ignore import prices
  correctOptionId: b
  explanation:
    zh-CN: 比较开放度、储备、冲击与政策自主性。 制度改变调整渠道；固定制需捍卫平价；浮动制让汇率吸收部分冲击
      没有对所有经济体都最优的汇率制度；管理浮动也不保证没有波动。
    en: Compare openness, reserves, shocks and policy autonomy. Regimes alter
      adjustment channels; pegs need parity defence; floating lets exchange
      rates absorb some shocks No regime is best for every economy; managed
      floating does not guarantee zero volatility.
- id: u4-58-exchange-regime-evaluation-short-1
  knowledgePointId: u4-58-exchange-regime-evaluation
  type: short-answer
  prompt:
    zh-CN: 解释固定与浮动汇率的评价的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Evaluating fixed and floating exchange rates and
      apply it to an example of your own.
  modelAnswer:
    zh-CN: 固定汇率可减少名义汇率不确定性但需要可信政策与储备；浮动允许外部调整与较大政策自主性，却可能波动并传递进口通胀。
      制度改变调整渠道；固定制需捍卫平价；浮动制让汇率吸收部分冲击
      原创假设：进口依赖高的经济体可能重视汇率稳定，但自由资本流动下独立降息会给平价施压；储备、信誉和供给适应能力决定可行性。
    en: "Fixed rates can reduce nominal exchange uncertainty but need credible
      policy and reserves. Floating permits external adjustment and more policy
      autonomy, while risking volatility and imported inflation. Regimes alter
      adjustment channels; pegs need parity defence; floating lets exchange
      rates absorb some shocks Hypothetical scenario: an import-dependent
      economy values stability, but independent rate cuts with mobile capital
      can pressure a peg. Reserves, credibility and supply adaptability
      determine feasibility."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 制度
        en: regimes
      alternatives:
        zh-CN:
          - 制度
          - 制度改变调整渠道
