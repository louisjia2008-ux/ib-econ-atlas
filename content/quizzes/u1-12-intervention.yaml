- id: u1-12-intervention-flash-1
  knowledgePointId: u1-12-intervention
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“干预”。
    en: Without notes, explain “Intervention” in your own words.
  answer:
    zh-CN: 经济干预是政府、中央银行或其他机构有意改变市场激励、交易条件、资源配置或收入分配的行动。
    en: Economic intervention is deliberate action by a government, central bank, or
      other institution to alter market incentives, trading conditions, resource
      allocation, or income distribution.
  explanation:
    zh-CN: 干预通过改变规则、价格或资源分配来影响经济行为，其成效要与副作用和执行成本一起评价。
    en: Intervention changes rules, prices, or resource allocation to influence
      behaviour; its benefits must be assessed alongside side effects and
      implementation costs.
- id: u1-12-intervention-mcq-1
  knowledgePointId: u1-12-intervention
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“干预”？
    en: Which statement best captures “Intervention”?
  options:
    - id: a
      zh-CN: 干预通过改变规则、价格或资源分配来影响经济行为，其成效要与副作用和执行成本一起评价。
      en: Intervention changes rules, prices, or resource allocation to influence
        behaviour; its benefits must be assessed alongside side effects and
        implementation costs.
    - id: b
      zh-CN: 它只描述个人偏好，与资源、制度或社会结果无关。
      en: It concerns personal preference only and has no connection to resources,
        institutions, or social outcomes.
    - id: c
      zh-CN: 它意味着同一种经济结果在任何条件下都会自动出现。
      en: It means the same economic outcome must arise automatically under every set
        of conditions.
    - id: d
      zh-CN: 它是一项只适用于高收入经济体的会计规则。
      en: It is an accounting rule that applies only to high-income economies.
  correctOptionId: a
  explanation:
    zh-CN: 经济干预是政府、中央银行或其他机构有意改变市场激励、交易条件、资源配置或收入分配的行动。
    en: Economic intervention is deliberate action by a government, central bank, or
      other institution to alter market incentives, trading conditions, resource
      allocation, or income distribution.
- id: u1-12-intervention-short-1
  knowledgePointId: u1-12-intervention
  type: short-answer
  prompt:
    zh-CN: 简要解释“干预”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “Intervention”, including one causal mechanism and one
      important implication.
  modelAnswer:
    zh-CN: 经济干预是政府、中央银行或其他机构有意改变市场激励、交易条件、资源配置或收入分配的行动。
      识别市场结果或社会目标之间的差距；选择税收、监管、支出或信息等工具；工具改变主体面对的激励与约束；行为反应形成预期成效与非预期后果
      干预有明确目标和政策工具。
    en: Economic intervention is deliberate action by a government, central bank, or
      other institution to alter market incentives, trading conditions, resource
      allocation, or income distribution. Identify a gap between a market
      outcome and a social objective; Select a tax, regulation, spending,
      information, or other instrument; The instrument changes incentives and
      constraints; Behavioural responses produce intended and unintended
      outcomes Intervention combines an objective with an instrument.
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
        zh-CN:
          - 干预
          - 政策干预
          - 政府介入
          - 经济调控
        en:
          - Intervention
          - policy intervention
          - government action
          - economic regulation
    - id: mechanism
      label:
        zh-CN: 因果机制
        en: Causal mechanism
      alternatives:
        zh-CN:
          - 识别市场结果或社会目标之间的差距
          - 选择税收、监管、支出或信息等工具
        en:
          - Identify a gap between a market outcome and a social objective
          - Select a tax, regulation, spending, information, or other instrument
    - id: implication
      label:
        zh-CN: 重要含义
        en: Important implication
      alternatives:
        zh-CN:
          - 干预有明确目标和政策工具。
          - 政策通过改变激励影响行为。
        en:
          - Intervention combines an objective with an instrument.
          - Policy works by changing incentives and behaviour.
  explanation:
    zh-CN: 系统按核心概念、因果机制和重要含义三个关键词组计算覆盖率；你可以查看依据并手动修正最终判定。
    en: Coverage is calculated across the core concept, causal mechanism, and
      implication groups; you can inspect and override the final judgement.
