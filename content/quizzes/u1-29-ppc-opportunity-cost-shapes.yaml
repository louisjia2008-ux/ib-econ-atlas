- id: u1-29-ppc-opportunity-cost-shapes-short-1
  knowledgePointId: u1-29-ppc-opportunity-cost-shapes
  type: short-answer
  prompt:
    zh-CN: 简要解释“递增与不变机会成本”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “Increasing and constant opportunity cost”, including one
      causal mechanism and one important implication.
  modelAnswer:
    zh-CN: 递增机会成本是连续增加一种产出时每个新增单位需放弃越来越多另一种产出；不变机会成本则表示交换比率保持相同。
      资源对两种生产的适用程度不同；先转移最适合新增产品的资源；继续扩大时必须转移越来越不适合的资源；每个新增单位造成更大的另一种产出损失
      异质和专业化资源导致递增成本。
    en: Increasing opportunity cost means that successive additions to one output
      require ever larger reductions in the other, while constant opportunity
      cost means that the trade-off ratio does not change. Resources differ in
      suitability for the two outputs; Resources best suited to the expanding
      good move first; Further expansion transfers increasingly unsuitable
      factors; Each extra unit requires a larger loss of the other output
      Heterogeneous and specialised resources generate increasing cost.
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
        zh-CN:
          - 递增与不变机会成本
          - 递增机会成本规律
          - 直线PPC
          - 凹向原点PPC
        en:
          - Increasing and constant opportunity cost
          - law of increasing opportunity cost
          - linear PPC
          - bowed-out PPC
    - id: mechanism
      label:
        zh-CN: 因果机制
        en: Causal mechanism
      alternatives:
        zh-CN:
          - 资源对两种生产的适用程度不同
          - 先转移最适合新增产品的资源
        en:
          - Resources differ in suitability for the two outputs
          - Resources best suited to the expanding good move first
    - id: implication
      label:
        zh-CN: 重要含义
        en: Important implication
      alternatives:
        zh-CN:
          - 异质和专业化资源导致递增成本。
          - 同质可替代资源可产生不变成本。
        en:
          - Heterogeneous and specialised resources generate increasing cost.
          - Homogeneous transferable resources can generate constant cost.
