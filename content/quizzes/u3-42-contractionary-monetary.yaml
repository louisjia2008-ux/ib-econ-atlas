- id: u3-42-contractionary-monetary-flash-1
  knowledgePointId: u3-42-contractionary-monetary
  type: flashcard
  prompt:
    zh-CN: 解释“紧缩性货币政策”，并说明一个关键条件。
    en: Explain Contractionary monetary policy and state one important condition.
  answer:
    zh-CN: 紧缩性货币政策提高融资成本或收紧金融条件以减弱总需求和通胀压力，但可能牺牲短期产出与就业。
    en: Contractionary monetary policy raises financing costs or tightens financial
      conditions to weaken aggregate demand and inflation pressure, potentially
      sacrificing short-run output and employment.
  explanation:
    zh-CN: 抑制通胀通常指降低涨价速度，不等于物价水平下降。
    en: Reducing inflation usually means slower price increases, not a falling price
      level.
- id: u3-42-contractionary-monetary-mcq-1
  knowledgePointId: u3-42-contractionary-monetary
  type: mcq
  prompt:
    zh-CN: 加息应对供给冲击的主要限制？
    en: A major limitation of raising rates against a supply shock?
  options:
    - id: a
      zh-CN: 立即增加能源产量
      en: Immediately increases energy production
    - id: b
      zh-CN: 不能直接修复供给且可能压低产出
      en: It cannot directly repair supply and may reduce output
    - id: c
      zh-CN: 没有时滞
      en: Has no lag
    - id: d
      zh-CN: 必然提高所有企业利润
      en: Necessarily raises every firm's profit
  correctOptionId: b
  explanation:
    zh-CN: 不能直接修复供给且可能压低产出。
      原创例：为缓和过热需求而加息后，住宅投资放缓。若通胀来自能源供给中断，加息不能直接恢复能源供给，降低通胀可能需要更大的产出代价。固定利率合同也会延迟影响。
      抑制通胀通常指降低涨价速度，不等于物价水平下降。
    en: "It cannot directly repair supply and may reduce output. Illustrative
      example: higher rates intended to cool excessive demand slow housing
      investment. If inflation reflects an energy supply disruption, tightening
      cannot directly restore energy supply and may entail a larger output cost.
      Fixed-rate contracts can delay the effect. Reducing inflation usually
      means slower price increases, not a falling price level."
- id: u3-42-contractionary-monetary-short-1
  knowledgePointId: u3-42-contractionary-monetary
  type: short-answer
  prompt:
    zh-CN: 解释紧缩性货币政策的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Contractionary monetary policy and apply it to an
      example of your own.
  modelAnswer:
    zh-CN: 紧缩性货币政策提高融资成本或收紧金融条件以减弱总需求和通胀压力，但可能牺牲短期产出与就业。
      提高政策利率；消费投资增速减弱使总需求相对降低；通胀压力下降但周期性失业可能增加
      原创例：为缓和过热需求而加息后，住宅投资放缓。若通胀来自能源供给中断，加息不能直接恢复能源供给，降低通胀可能需要更大的产出代价。固定利率合同也会延迟影响。
    en: "Contractionary monetary policy raises financing costs or tightens financial
      conditions to weaken aggregate demand and inflation pressure, potentially
      sacrificing short-run output and employment. Raise policy interest rates;
      consumption and investment weaken and aggregate demand is lower than
      otherwise; inflation pressure falls but cyclical unemployment may rise
      Illustrative example: higher rates intended to cool excessive demand slow
      housing investment. If inflation reflects an energy supply disruption,
      tightening cannot directly restore energy supply and may entail a larger
      output cost. Fixed-rate contracts can delay the effect."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 提高政策利率
        en: raise policy interest rates
      alternatives:
        zh-CN:
          - 提高政策利率
          - 提高政策利率
        en:
          - raise policy interest rates
          - Raise policy interest rates
    - id: mechanism-2
      label:
        zh-CN: 总需求
        en: aggregate demand
      alternatives:
        zh-CN:
          - 总需求
          - 消费投资增速减弱使总需求相对降低
        en:
          - aggregate demand
          - consumption and investment weaken and aggregate demand is lower than
            otherwise
    - id: mechanism-3
      label:
        zh-CN: 周期性失业
        en: cyclical unemployment
      alternatives:
        zh-CN:
          - 周期性失业
          - 通胀压力下降但周期性失业可能增加
        en:
          - cyclical unemployment
          - inflation pressure falls but cyclical unemployment may rise
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
