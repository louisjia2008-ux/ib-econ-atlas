- id: u3-35-lorenz-gini-flash-1
  knowledgePointId: u3-35-lorenz-gini
  type: flashcard
  prompt:
    zh-CN: 解释“洛伦兹曲线与基尼计算”，并说明一个关键条件。
    en: Explain Lorenz curves and Gini calculations and state one important
      condition.
  answer:
    zh-CN: 洛伦兹曲线按从贫到富排列人口累计占比及收入累计占比；基尼系数为平等线与曲线间面积占平等线下总面积的比例。
    en: A Lorenz curve plots cumulative income shares against cumulative population
      ranked poorest to richest. Gini is the area between the equality line and
      Lorenz curve divided by total area under equality.
  explanation:
    zh-CN: 收入基尼不直接等于财富基尼，也不显示绝对贫困人数。
    en: An income Gini is not a wealth Gini and does not directly count absolute
      poverty.
- id: u3-35-lorenz-gini-mcq-1
  knowledgePointId: u3-35-lorenz-gini
  type: mcq
  prompt:
    zh-CN: 平等线下 0.5、洛伦兹下 0.35，Gini 为多少？
    en: Equality area is 0.5 and Lorenz area 0.35. What is Gini?
  options:
    - id: a
      zh-CN: "0.15"
      en: "0.15"
    - id: b
      zh-CN: "0.7"
      en: "0.7"
    - id: c
      zh-CN: "0.3"
      en: "0.3"
    - id: d
      zh-CN: "0.85"
      en: "0.85"
  correctOptionId: c
  explanation:
    zh-CN: 0.3。 原创例：横纵轴用 0 到 1 表示，平等线下面积为 0.5。若洛伦兹曲线下方面积为
      0.3，Gini=(0.5−0.3)/0.5=0.4。曲线交叉时，不同分配变化不能只凭一处距离判断整体排名。
      收入基尼不直接等于财富基尼，也不显示绝对贫困人数。
    en: "0.3. Illustrative example: with both axes from zero to one, equality has
      area 0.5. If the area under Lorenz is 0.3, Gini=(0.5−0.3)/0.5=0.4.
      Crossing Lorenz curves cannot be ranked by a single local distance. An
      income Gini is not a wealth Gini and does not directly count absolute
      poverty."
- id: u3-35-lorenz-gini-short-1
  knowledgePointId: u3-35-lorenz-gini
  type: short-answer
  prompt:
    zh-CN: 解释洛伦兹曲线与基尼计算的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Lorenz curves and Gini calculations and apply it to
      an example of your own.
  modelAnswer:
    zh-CN: 洛伦兹曲线按从贫到富排列人口累计占比及收入累计占比；基尼系数为平等线与曲线间面积占平等线下总面积的比例。
      按收入排序并累计份额；与完全平等线比较；面积差越大通常表示收入不平等越高 原创例：横纵轴用 0 到 1 表示，平等线下面积为
      0.5。若洛伦兹曲线下方面积为 0.3，Gini=(0.5−0.3)/0.5=0.4。曲线交叉时，不同分配变化不能只凭一处距离判断整体排名。
    en: "A Lorenz curve plots cumulative income shares against cumulative population
      ranked poorest to richest. Gini is the area between the equality line and
      Lorenz curve divided by total area under equality. Rank incomes and
      cumulate shares; compare with perfect equality; a larger area gap normally
      indicates more inequality Illustrative example: with both axes from zero
      to one, equality has area 0.5. If the area under Lorenz is 0.3,
      Gini=(0.5−0.3)/0.5=0.4. Crossing Lorenz curves cannot be ranked by a
      single local distance."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 累计
        en: cumulative
      alternatives:
        zh-CN:
          - 累计
          - 按收入排序并累计份额
        en:
          - cumulative
          - Rank incomes and cumulate shares
    - id: mechanism-2
      label:
        zh-CN: 面积
        en: area
      alternatives:
        zh-CN:
          - 面积
          - 与完全平等线比较
        en:
          - area
          - compare with perfect equality
    - id: mechanism-3
      label:
        zh-CN: 平等线
        en: equality line
      alternatives:
        zh-CN:
          - 平等线
          - 面积差越大通常表示收入不平等越高
        en:
          - equality line
          - a larger area gap normally indicates more inequality
  explanation:
