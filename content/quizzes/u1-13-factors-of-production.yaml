- id: u1-13-factors-of-production-flash-1
  knowledgePointId: u1-13-factors-of-production
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“四类生产要素”。
    en: Without notes, explain “Factors of production” in your own words.
  answer:
    zh-CN: 生产要素是创造商品和服务所需的投入，通常分为土地（自然资源）、劳动（人的努力与技能）、资本（人造生产资料）和企业家才能（组织、创新与承担风险）。
    en: "Factors of production are the inputs used to create goods and services:
      land (natural resources), labour (human effort and skill), capital
      (produced means of production), and entrepreneurship (organisation,
      innovation, and risk-bearing)."
  explanation:
    zh-CN: 生产把土地、劳动、资本与企业家才能组合起来；每类要素的数量和质量都会限制产出。
    en: Production combines land, labour, capital, and entrepreneurship; both the
      quantity and quality of each factor constrain output.
- id: u1-13-factors-of-production-mcq-1
  knowledgePointId: u1-13-factors-of-production
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“四类生产要素”？
    en: Which statement best captures “Factors of production”?
  options:
    - id: a
      zh-CN: 它只描述个人偏好，与资源、制度或社会结果无关。
      en: It concerns personal preference only and has no connection to resources,
        institutions, or social outcomes.
    - id: b
      zh-CN: 生产把土地、劳动、资本与企业家才能组合起来；每类要素的数量和质量都会限制产出。
      en: Production combines land, labour, capital, and entrepreneurship; both the
        quantity and quality of each factor constrain output.
    - id: c
      zh-CN: 它意味着同一种经济结果在任何条件下都会自动出现。
      en: It means the same economic outcome must arise automatically under every set
        of conditions.
    - id: d
      zh-CN: 它是一项只适用于高收入经济体的会计规则。
      en: It is an accounting rule that applies only to high-income economies.
  correctOptionId: b
  explanation:
    zh-CN: 生产要素是创造商品和服务所需的投入，通常分为土地（自然资源）、劳动（人的努力与技能）、资本（人造生产资料）和企业家才能（组织、创新与承担风险）。
    en: "Factors of production are the inputs used to create goods and services:
      land (natural resources), labour (human effort and skill), capital
      (produced means of production), and entrepreneurship (organisation,
      innovation, and risk-bearing)."
