- id: u1-13-factors-of-production-flash-1
  knowledgePointId: u1-13-factors-of-production
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“四类生产要素”。
    en: Without notes, explain “Factors of production” in your own words.
  answer:
    zh-CN: 生产要素是创造商品和服务所需的投入，通常分为土地（自然资源）、劳动（人的努力与技能）、资本（人造生产资料）和企业家才能（组织、创新与承担风险）。
    en: "Factors of production are the inputs used to create goods and services:
      land (natural resources), labour (human effort and skill), capital
      (produced means of production), and entrepreneurship (organisation,
      innovation, and risk-bearing)."
  explanation:
    zh-CN: 生产把土地、劳动、资本与企业家才能组合起来；每类要素的数量和质量都会限制产出。
    en: Production combines land, labour, capital, and entrepreneurship; both the
      quantity and quality of each factor constrain output.
- id: u1-13-factors-of-production-mcq-1
  knowledgePointId: u1-13-factors-of-production
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“四类生产要素”？
    en: Which statement best captures “Factors of production”?
  options:
    - id: a
      zh-CN: 它只描述个人偏好，与资源、制度或社会结果无关。
      en: It concerns personal preference only and has no connection to resources,
        institutions, or social outcomes.
    - id: b
      zh-CN: 生产把土地、劳动、资本与企业家才能组合起来；每类要素的数量和质量都会限制产出。
      en: Production combines land, labour, capital, and entrepreneurship; both the
        quantity and quality of each factor constrain output.
    - id: c
      zh-CN: 它意味着同一种经济结果在任何条件下都会自动出现。
      en: It means the same economic outcome must arise automatically under every set
        of conditions.
    - id: d
      zh-CN: 它是一项只适用于高收入经济体的会计规则。
      en: It is an accounting rule that applies only to high-income economies.
  correctOptionId: b
  explanation:
    zh-CN: 生产要素是创造商品和服务所需的投入，通常分为土地（自然资源）、劳动（人的努力与技能）、资本（人造生产资料）和企业家才能（组织、创新与承担风险）。
    en: "Factors of production are the inputs used to create goods and services:
      land (natural resources), labour (human effort and skill), capital
      (produced means of production), and entrepreneurship (organisation,
      innovation, and risk-bearing)."
- id: u1-13-factors-of-production-short-1
  knowledgePointId: u1-13-factors-of-production
  type: short-answer
  prompt:
    zh-CN: 简要解释“四类生产要素”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “Factors of production”, including one causal mechanism and
      one important implication.
  modelAnswer:
    zh-CN: 生产要素是创造商品和服务所需的投入，通常分为土地（自然资源）、劳动（人的努力与技能）、资本（人造生产资料）和企业家才能（组织、创新与承担风险）。
      自然资源提供物质与空间；劳动投入时间、技能和判断；资本提高劳动与资源的生产能力；企业家组合要素并承担不确定性 土地包括自然资源。
    en: "Factors of production are the inputs used to create goods and services:
      land (natural resources), labour (human effort and skill), capital
      (produced means of production), and entrepreneurship (organisation,
      innovation, and risk-bearing). Natural resources provide materials and
      location; Labour contributes time, skill, and judgement; Capital raises
      the productive capacity of labour and resources; Entrepreneurship combines
      inputs under uncertainty Land includes natural resources."
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
        zh-CN:
          - 四类生产要素
          - 生产投入
          - 土地劳动资本企业家
          - 资源要素
        en:
          - Factors of production
          - productive inputs
          - land labour capital entrepreneurship
          - economic resources
    - id: mechanism
      label:
        zh-CN: 因果机制
        en: Causal mechanism
      alternatives:
        zh-CN:
          - 自然资源提供物质与空间
          - 劳动投入时间、技能和判断
        en:
          - Natural resources provide materials and location
          - Labour contributes time, skill, and judgement
    - id: implication
      label:
        zh-CN: 重要含义
        en: Important implication
      alternatives:
        zh-CN:
          - 土地包括自然资源。
          - 劳动包括人的体力、技能和时间。
        en:
          - Land includes natural resources.
          - Labour includes human time, effort, and skill.
  explanation:
    zh-CN: 系统按核心概念、因果机制和重要含义三个关键词组计算覆盖率；你可以查看依据并手动修正最终判定。
    en: Coverage is calculated across the core concept, causal mechanism, and
      implication groups; you can inspect and override the final judgement.
