- id: u2-02-law-of-demand-flash-1
  knowledgePointId: u2-02-law-of-demand
  type: flashcard
  prompt:
    zh-CN: 解释“需求定律”，并说明一个关键条件。
    en: Explain The law of demand and state one important condition.
  answer:
    zh-CN: 其他条件不变时，商品价格上升通常导致需求量减少，价格下降通常导致需求量增加。
    en: Ceteris paribus, a higher price normally reduces quantity demanded and a
      lower price increases it.
  explanation:
    zh-CN: 曲线向下倾斜是有条件的关系，不能把相关性当成无条件因果。
    en: A downward slope is a conditional relationship, not unconditional causation
      inferred from correlation.
- id: u2-02-law-of-demand-mcq-1
  knowledgePointId: u2-02-law-of-demand
  type: mcq
  prompt:
    zh-CN: 只有商品自身价格上升，需求量通常怎样变化？
    en: Only the good’s own price rises. What normally happens to quantity demanded?
  options:
    - id: a
      zh-CN: 需求曲线必定右移
      en: Demand necessarily shifts right
    - id: b
      zh-CN: 沿原需求曲线减少
      en: It falls along the existing demand curve
    - id: c
      zh-CN: 供给曲线必定左移
      en: Supply necessarily shifts left
    - id: d
      zh-CN: 需求量必定增加
      en: Quantity demanded necessarily rises
  correctOptionId: b
  explanation:
    zh-CN: 沿原需求曲线减少。 自身价格与需求量反向变化；收入等其他因素保持不变；在既定需求曲线上比较数量
      曲线向下倾斜是有条件的关系，不能把相关性当成无条件因果。
    en: It falls along the existing demand curve. Own price and quantity demanded
      move inversely; hold income and other determinants constant; compare
      quantities on the existing demand curve A downward slope is a conditional
      relationship, not unconditional causation inferred from correlation.
- id: u2-02-law-of-demand-short-1
  knowledgePointId: u2-02-law-of-demand
  type: short-answer
  prompt:
    zh-CN: 解释需求定律的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of The law of demand and apply it to an example of
      your own.
  modelAnswer:
    zh-CN: 其他条件不变时，商品价格上升通常导致需求量减少，价格下降通常导致需求量增加。
      自身价格与需求量反向变化；收入等其他因素保持不变；在既定需求曲线上比较数量
      原创例：公交票价提高，其他条件不变时需求量通常下降，这是沿曲线移动。收入效应与替代效应的推导属于 HL 深入。
    en: "Ceteris paribus, a higher price normally reduces quantity demanded and a
      lower price increases it. Own price and quantity demanded move inversely;
      hold income and other determinants constant; compare quantities on the
      existing demand curve Illustrative example: a bus fare rises and, other
      things equal, quantity demanded normally falls along the curve. Deriving
      income and substitution effects is HL detail."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 自身价格
        en: own price
      alternatives:
        zh-CN:
          - 自身价格
          - 自身价格与需求量反向变化
        en:
          - own price
          - Own price and quantity demanded move inversely
    - id: mechanism-2
      label:
        zh-CN: 其他条件不变
        en: other things equal
      alternatives:
        zh-CN:
          - 其他条件不变
          - 收入等其他因素保持不变
        en:
          - other things equal
          - hold income and other determinants constant
    - id: mechanism-3
      label:
        zh-CN: 沿曲线
        en: along the curve
      alternatives:
        zh-CN:
          - 沿曲线
          - 在既定需求曲线上比较数量
        en:
          - along the curve
          - compare quantities on the existing demand curve
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
