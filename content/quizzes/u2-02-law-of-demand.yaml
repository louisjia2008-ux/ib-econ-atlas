- id: u2-02-law-of-demand-flash-1
  knowledgePointId: u2-02-law-of-demand
  type: flashcard
  prompt:
    zh-CN: 解释“需求定律”，并说明一个关键条件。
    en: Explain The law of demand and state one important condition.
  answer:
    zh-CN: 其他条件不变时，商品价格上升通常导致需求量减少，价格下降通常导致需求量增加。
    en: Ceteris paribus, a higher price normally reduces quantity demanded and a
      lower price increases it.
  explanation:
    zh-CN: 曲线向下倾斜是有条件的关系，不能把相关性当成无条件因果。
    en: A downward slope is a conditional relationship, not unconditional causation
      inferred from correlation.
- id: u2-02-law-of-demand-mcq-1
  knowledgePointId: u2-02-law-of-demand
  type: mcq
  prompt:
    zh-CN: 公交涨价后转乘未涨价地铁，主要体现什么？
    en: Switching to an unchanged-price train after a bus fare rise illustrates
      what?
  options:
    - id: a
      zh-CN: 公交供给增加
      en: Increased bus supply
    - id: b
      zh-CN: 替代效应
      en: Substitution effect
    - id: c
      zh-CN: 所有需求消失
      en: All demand disappears
    - id: d
      zh-CN: 收入必然增加
      en: Income necessarily rises
  correctOptionId: b
  explanation:
    zh-CN: 替代效应。
      原创例：公交票价提高而地铁票价不变，一些乘客改乘地铁。解释价格反应时应保持两种服务质量和收入不变；若同时改善公交服务，就无法只凭购买量判断价格效应。
      曲线向下倾斜是有条件的关系，不能把相关性当成无条件因果。
    en: "Substitution effect. Illustrative example: a bus fare rises while the train
      fare stays unchanged, so some passengers switch. Hold service quality and
      income constant to isolate the price effect. A simultaneous quality
      improvement would confound the inference. A downward slope is a
      conditional relationship, not unconditional causation inferred from
      correlation."
- id: u2-02-law-of-demand-short-1
  knowledgePointId: u2-02-law-of-demand
  type: short-answer
  prompt:
    zh-CN: 解释需求定律的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of The law of demand and apply it to an example of
      your own.
  modelAnswer:
    zh-CN: 其他条件不变时，商品价格上升通常导致需求量减少，价格下降通常导致需求量增加。
      价格上升提高购买的机会成本；消费者转向相对便宜的替代品；给定收入的实际购买力下降
      原创例：公交票价提高而地铁票价不变，一些乘客改乘地铁。解释价格反应时应保持两种服务质量和收入不变；若同时改善公交服务，就无法只凭购买量判断价格效应。
    en: "Ceteris paribus, a higher price normally reduces quantity demanded and a
      lower price increases it. A price rise increases the opportunity cost of
      buying; consumers substitute toward relatively cheaper goods; purchasing
      power falls at a given money income Illustrative example: a bus fare rises
      while the train fare stays unchanged, so some passengers switch. Hold
      service quality and income constant to isolate the price effect. A
      simultaneous quality improvement would confound the inference."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 其他条件不变
        en: ceteris paribus
      alternatives:
        zh-CN:
          - 其他条件不变
          - 价格上升提高购买的机会成本
        en:
          - ceteris paribus
          - A price rise increases the opportunity cost of buying
    - id: mechanism-2
      label:
        zh-CN: 替代
        en: substitution
      alternatives:
        zh-CN:
          - 替代
          - 消费者转向相对便宜的替代品
        en:
          - substitution
          - consumers substitute toward relatively cheaper goods
    - id: mechanism-3
      label:
        zh-CN: 购买力
        en: purchasing power
      alternatives:
        zh-CN:
          - 购买力
          - 给定收入的实际购买力下降
        en:
          - purchasing power
          - purchasing power falls at a given money income
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
