- id: u2-27-price-ceiling-flash-1
  knowledgePointId: u2-27-price-ceiling
  type: flashcard
  prompt:
    zh-CN: 解释“最高限价”，并说明一个关键条件。
    en: Explain Price ceilings and state one important condition.
  answer:
    zh-CN: 最高限价规定合法最高价格；低于均衡价格时具有约束力，并通常导致需求量超过供给量。
    en: A price ceiling sets a legal maximum price. Below equilibrium it is binding
      and normally creates excess demand.
  explanation:
    zh-CN: 高于均衡的最高限价通常没有约束力。
    en: A ceiling above equilibrium is normally non-binding.
- id: u2-27-price-ceiling-mcq-1
  knowledgePointId: u2-27-price-ceiling
  type: mcq
  prompt:
    zh-CN: 低于均衡的最高限价通常产生什么？
    en: What normally follows a price ceiling below equilibrium?
  options:
    - id: a
      zh-CN: 过剩
      en: A surplus
    - id: b
      zh-CN: 价格必升至均衡以上
      en: Price must rise above equilibrium
    - id: c
      zh-CN: 短缺
      en: A shortage
    - id: d
      zh-CN: 供需曲线必同时右移
      en: Both curves must shift right
  correctOptionId: c
  explanation:
    zh-CN: 短缺。 价格被限制在均衡以下；买方需求量增加、卖方供给量减少；短缺需要非价格配给 高于均衡的最高限价通常没有约束力。
    en: A shortage. Price is held below equilibrium; quantity demanded rises and
      quantity supplied falls; shortages require non-price rationing A ceiling
      above equilibrium is normally non-binding.
- id: u2-27-price-ceiling-short-1
  knowledgePointId: u2-27-price-ceiling
  type: short-answer
  prompt:
    zh-CN: 解释最高限价的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Price ceilings and apply it to an example of your
      own.
  modelAnswer:
    zh-CN: 最高限价规定合法最高价格；低于均衡价格时具有约束力，并通常导致需求量超过供给量。
      价格被限制在均衡以下；买方需求量增加、卖方供给量减少；短缺需要非价格配给
      原创例：低于均衡的最高限价使需求量超过供给量，可能出现排队、黑市和非价格配给；低租金不保证人人有房。数量与支出计算属于 HL。
    en: "A price ceiling sets a legal maximum price. Below equilibrium it is binding
      and normally creates excess demand. Price is held below equilibrium;
      quantity demanded rises and quantity supplied falls; shortages require
      non-price rationing Illustrative example: a ceiling below equilibrium
      creates excess demand and can lead to queues, black markets and non-price
      rationing. Low rent does not guarantee housing access. Quantity and
      expenditure calculations are HL."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 低于均衡
        en: below equilibrium
      alternatives:
        zh-CN:
          - 低于均衡
          - 价格被限制在均衡以下
        en:
          - below equilibrium
          - Price is held below equilibrium
    - id: mechanism-2
      label:
        zh-CN: 短缺
        en: shortage
      alternatives:
        zh-CN:
          - 短缺
          - 买方需求量增加、卖方供给量减少
        en:
          - shortage
          - quantity demanded rises and quantity supplied falls
    - id: mechanism-3
      label:
        zh-CN: 配给
        en: rationing
      alternatives:
        zh-CN:
          - 配给
          - 短缺需要非价格配给
        en:
          - rationing
          - shortages require non-price rationing
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
- id: u2-27-price-ceiling-mcq-hl-1
  knowledgePointId: u2-27-price-ceiling
  type: mcq
  level: hl
  prompt:
    zh-CN: 限价下 Qd=120、Qs=80，短缺多少？
    en: At a ceiling Qd=120 and Qs=80. What is the shortage?
  options:
    - id: a
      zh-CN: "80"
      en: "80"
    - id: b
      zh-CN: "120"
      en: "120"
    - id: c
      zh-CN: "200"
      en: "200"
    - id: d
      zh-CN: "40"
      en: "40"
  correctOptionId: d
  explanation:
    zh-CN: 40。 120 − 80 = 40
    en: 40. 120 − 80 = 40
