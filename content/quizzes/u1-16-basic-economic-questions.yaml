- id: u1-16-basic-economic-questions-short-1
  knowledgePointId: u1-16-basic-economic-questions
  type: short-answer
  prompt:
    zh-CN: 简要解释“三个基本经济问题”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “The three basic economic questions”, including one causal
      mechanism and one important implication.
  modelAnswer:
    zh-CN: 三个基本经济问题是：生产哪些商品与服务以及数量多少；用哪些资源、技术和组织方式生产；最终产出由哪些人或群体获得。
      稀缺资源有多个竞争用途；社会决定产品组合与数量；生产者选择投入和技术；收入与规则决定产出分配 产品组合回答生产什么及多少。
    en: The three basic economic questions ask which goods and services to produce
      and in what quantities, which resources and techniques to use, and which
      people or groups ultimately receive the output. Scarce resources have
      competing uses; Society determines the output mix and quantities;
      Producers select inputs, technology, and organisation; Income and
      allocation rules determine access to output The output mix answers what
      and how much.
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
        zh-CN:
          - 三个基本经济问题
          - 生产什么怎样生产为谁生产
          - 基本资源配置问题
          - what how for whom
        en:
          - The three basic economic questions
          - what how for whom
          - basic allocation questions
          - fundamental economic questions
    - id: mechanism
      label:
        zh-CN: 因果机制
        en: Causal mechanism
      alternatives:
        zh-CN:
          - 稀缺资源有多个竞争用途
          - 社会决定产品组合与数量
        en:
          - Scarce resources have competing uses
          - Society determines the output mix and quantities
    - id: implication
      label:
        zh-CN: 重要含义
        en: Important implication
      alternatives:
        zh-CN:
          - 产品组合回答生产什么及多少。
          - 投入与技术回答怎样生产。
        en:
          - The output mix answers what and how much.
          - Inputs and technology answer how.
  explanation:
    zh-CN: 系统按核心概念、因果机制和重要含义三个关键词组计算覆盖率；你可以查看依据并手动修正最终判定。
    en: Coverage is calculated across the core concept, causal mechanism, and
      implication groups; you can inspect and override the final judgement.
