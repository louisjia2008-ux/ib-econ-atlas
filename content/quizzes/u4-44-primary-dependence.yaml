- id: u4-44-primary-dependence-flash-1
  knowledgePointId: u4-44-primary-dependence
  type: flashcard
  prompt:
    zh-CN: 解释“初级产品依赖与收入波动”，并说明一个关键条件。
    en: Explain Primary-product dependence and revenue volatility and state one
      important condition.
  answer:
    zh-CN: 出口集中于少数初级产品会使外汇、税收与投资暴露于价格和需求冲击；多样化可降低某些集中风险。
    en: Concentration in a few primary exports exposes foreign exchange, tax revenue
      and investment to price and demand shocks; diversification may reduce some
      concentration risk.
  explanation:
    zh-CN: 贸易条件不是汇率，也不是出口总额除以进口总额；长期价格下降并非每种商品必然发生。
    en: Terms of trade are neither an exchange rate nor total export receipts
      divided by imports; long-run deterioration is not inevitable for every
      commodity.
- id: u4-44-primary-dependence-mcq-1
  knowledgePointId: u4-44-primary-dependence
  type: mcq
  prompt:
    zh-CN: 为何单一初级产品出口依赖增加风险？
    en: Why does dependence on one primary export raise risk?
  options:
    - id: a
      zh-CN: 出口收入不受价格影响
      en: Export receipts never depend on price
    - id: b
      zh-CN: 数量与成本无关紧要
      en: Volumes and costs never matter
    - id: c
      zh-CN: 多样化必定增加所有风险
      en: Diversification must increase every risk
    - id: d
      zh-CN: 一次产品价格冲击可同时打击多个收入来源
      en: One commodity-price shock can hit several income sources
  correctOptionId: d
  explanation:
    zh-CN: 一次产品价格冲击可同时打击多个收入来源。 出口集中放大外部冲击；外汇和税收随价格数量变化；公共投资与进口融资受限
      贸易条件不是汇率，也不是出口总额除以进口总额；长期价格下降并非每种商品必然发生。
    en: One commodity-price shock can hit several income sources. Export
      concentration magnifies external shocks; foreign exchange and tax receipts
      vary with prices and volumes; public investment and import finance are
      constrained Terms of trade are neither an exchange rate nor total export
      receipts divided by imports; long-run deterioration is not inevitable for
      every commodity.
- id: u4-44-primary-dependence-short-1
  knowledgePointId: u4-44-primary-dependence
  type: short-answer
  prompt:
    zh-CN: 解释初级产品依赖与收入波动的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Primary-product dependence and revenue volatility
      and apply it to an example of your own.
  modelAnswer:
    zh-CN: 出口集中于少数初级产品会使外汇、税收与投资暴露于价格和需求冲击；多样化可降低某些集中风险。
      出口集中放大外部冲击；外汇和税收随价格数量变化；公共投资与进口融资受限
      原创假设：咖啡价格下降时，依赖咖啡的家庭、出口商和政府收入可同时受损，设备进口也更难融资；价格、数量及成本共同决定净收益。贸易条件指数另列为扩展内容。
    en: "Concentration in a few primary exports exposes foreign exchange, tax
      revenue and investment to price and demand shocks; diversification may
      reduce some concentration risk. Export concentration magnifies external
      shocks; foreign exchange and tax receipts vary with prices and volumes;
      public investment and import finance are constrained Hypothetical
      scenario: a coffee-price fall can hit households, exporters and public
      revenue together, constraining finance for equipment imports. Price,
      quantity and costs jointly determine net returns. A terms-of-trade index
      is listed separately as enrichment."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 集中
        en: concentration
      alternatives:
        zh-CN:
          - 集中
          - 出口集中放大外部冲击
        en:
          - concentration
          - Export concentration magnifies external shocks
    - id: mechanism-2
      label:
        zh-CN: 波动
        en: volatility
      alternatives:
        zh-CN:
          - 波动
          - 外汇和税收随价格数量变化
        en:
          - volatility
          - foreign exchange and tax receipts vary with prices and volumes
    - id: mechanism-3
      label:
        zh-CN: 外汇
        en: foreign exchange
      alternatives:
        zh-CN:
          - 外汇
          - 公共投资与进口融资受限
        en:
          - foreign exchange
          - public investment and import finance are constrained
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
