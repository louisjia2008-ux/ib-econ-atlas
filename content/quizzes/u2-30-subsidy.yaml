- id: u2-30-subsidy-flash-1
  knowledgePointId: u2-30-subsidy
  type: flashcard
  prompt:
    zh-CN: 解释“补贴与财政成本”，并说明一个关键条件。
    en: Explain Subsidies and fiscal cost and state one important condition.
  answer:
    zh-CN: 单位补贴使卖方收到的金额高于买方支付价格，鼓励生产和消费；政府支出为单位补贴乘以补贴数量。
    en: A per-unit subsidy makes the seller's receipt exceed the buyer's payment and
      encourages production and consumption. Government spending is the subsidy
      per unit times subsidised quantity.
  explanation:
    zh-CN: 补贴后的均衡数量应进入财政成本计算，不能使用税补前数量。
    en: Use the subsidised equilibrium quantity in the spending calculation, not the
      pre-policy quantity.
- id: u2-30-subsidy-mcq-1
  knowledgePointId: u2-30-subsidy
  type: mcq
  prompt:
    zh-CN: 补贴的财政成本为何重要？
    en: Why does a subsidy’s fiscal cost matter?
  options:
    - id: a
      zh-CN: 政府资金没有资源成本
      en: Government funds have no resource cost
    - id: b
      zh-CN: 资金具有其他用途的机会成本
      en: Funds have an opportunity cost in alternative uses
    - id: c
      zh-CN: 补贴必使所有外部性消失
      en: Subsidies remove every externality
    - id: d
      zh-CN: 产量越高必定越有效率
      en: More output always means more efficiency
  correctOptionId: b
  explanation:
    zh-CN: 资金具有其他用途的机会成本。 补贴降低生产者净边际成本；供给右移、数量增加；财政支出与收益在买卖双方间分配
      补贴后的均衡数量应进入财政成本计算，不能使用税补前数量。
    en: Funds have an opportunity cost in alternative uses. A subsidy lowers
      producers' net marginal cost; supply shifts right and quantity rises;
      spending and gains are distributed between buyers and sellers Use the
      subsidised equilibrium quantity in the spending calculation, not the
      pre-policy quantity.
- id: u2-30-subsidy-short-1
  knowledgePointId: u2-30-subsidy
  type: short-answer
  prompt:
    zh-CN: 解释补贴与财政成本的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Subsidies and fiscal cost and apply it to an
      example of your own.
  modelAnswer:
    zh-CN: 单位补贴使卖方收到的金额高于买方支付价格，鼓励生产和消费；政府支出为单位补贴乘以补贴数量。
      补贴降低生产者净边际成本；供给右移、数量增加；财政支出与收益在买卖双方间分配
      原创例：单位补贴使生产者净收高于消费者支付，通常增加数量并产生财政支出；应比较消费者与生产者收益、融资机会成本及外部性。财政支出数值计算属于 HL。
    en: "A per-unit subsidy makes the seller's receipt exceed the buyer's payment
      and encourages production and consumption. Government spending is the
      subsidy per unit times subsidised quantity. A subsidy lowers producers'
      net marginal cost; supply shifts right and quantity rises; spending and
      gains are distributed between buyers and sellers Illustrative example: a
      subsidy raises producer receipts above consumer payment, normally
      increasing quantity with a fiscal cost. Compare consumer and producer
      gains, financing opportunity cost and externalities. Numerical fiscal
      calculations are HL."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 补贴
        en: subsidy
      alternatives:
        zh-CN:
          - 补贴
          - 补贴降低生产者净边际成本
        en:
          - subsidy
          - A subsidy lowers producers' net marginal cost
    - id: mechanism-2
      label:
        zh-CN: 数量
        en: quantity
      alternatives:
        zh-CN:
          - 数量
          - 供给右移、数量增加
        en:
          - quantity
          - supply shifts right and quantity rises
    - id: mechanism-3
      label:
        zh-CN: 财政
        en: government spending
      alternatives:
        zh-CN:
          - 财政
          - 财政支出与收益在买卖双方间分配
        en:
          - government spending
          - spending and gains are distributed between buyers and sellers
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
- id: u2-30-subsidy-mcq-hl-1
  knowledgePointId: u2-30-subsidy
  type: mcq
  level: hl
  prompt:
    zh-CN: 单位补贴 5，补贴数量 40，政府支出为多少？
    en: A subsidy is five per unit on 40 units. What is government spending?
  options:
    - id: a
      zh-CN: "8"
      en: "8"
    - id: b
      zh-CN: "40"
      en: "40"
    - id: c
      zh-CN: "200"
      en: "200"
    - id: d
      zh-CN: "45"
      en: "45"
  correctOptionId: c
  explanation:
    zh-CN: 200。 5 × 40 = 200
    en: 200. 5 × 40 = 200
