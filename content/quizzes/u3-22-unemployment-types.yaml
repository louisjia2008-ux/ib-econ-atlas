- id: u3-22-unemployment-types-flash-1
  knowledgePointId: u3-22-unemployment-types
  type: flashcard
  prompt:
    zh-CN: 解释“失业类型与自然失业”，并说明一个关键条件。
    en: Explain Types of unemployment and natural unemployment and state one
      important condition.
  answer:
    zh-CN: 摩擦性失业来自寻找和转换工作；结构性失业来自技能或地点不匹配；周期性失业来自需求不足；季节性失业随季节变化。
    en: Frictional unemployment comes from job search, structural unemployment from
      skill or location mismatch, cyclical unemployment from weak demand, and
      seasonal unemployment from seasonal activity.
  explanation:
    zh-CN: 充分就业不是失业率为零；自然失业率也会随制度和匹配条件变化。
    en: Full employment is not zero unemployment; the natural rate can change with
      institutions and matching conditions.
- id: u3-22-unemployment-types-mcq-1
  knowledgePointId: u3-22-unemployment-types
  type: mcq
  prompt:
    zh-CN: 技能过时导致岗位与劳动者不匹配，属于什么？
    en: Obsolete skills cause a mismatch between workers and jobs. Which type is
      this?
  options:
    - id: a
      zh-CN: 纯周期性失业
      en: Purely cyclical unemployment
    - id: b
      zh-CN: 结构性失业
      en: Structural unemployment
    - id: c
      zh-CN: 纯季节性失业
      en: Purely seasonal unemployment
    - id: d
      zh-CN: 就业增加
      en: Higher employment
  correctOptionId: b
  explanation:
    zh-CN: 结构性失业。
      原创例：零售工人因需求衰退被裁员主要属周期性；某技能被新技术淘汰则主要属结构性。增加总需求可能帮助前者，却不能单独解决后者的技能缺口。自然失业通常包括摩擦性与结构性成分。
      充分就业不是失业率为零；自然失业率也会随制度和匹配条件变化。
    en: "Structural unemployment. Illustrative example: retail layoffs during a
      demand slump are mainly cyclical; a skill displaced by technology creates
      mainly structural unemployment. Higher AD can help the former without
      alone filling the latter's skill gap. Natural unemployment normally
      includes frictional and structural components. Full employment is not zero
      unemployment; the natural rate can change with institutions and matching
      conditions."
- id: u3-22-unemployment-types-short-1
  knowledgePointId: u3-22-unemployment-types
  type: short-answer
  prompt:
    zh-CN: 解释失业类型与自然失业的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Types of unemployment and natural unemployment and
      apply it to an example of your own.
  modelAnswer:
    zh-CN: 摩擦性失业来自寻找和转换工作；结构性失业来自技能或地点不匹配；周期性失业来自需求不足；季节性失业随季节变化。
      识别失业的主要机制；区分需求不足与匹配问题；选择与成因相符的政策
      原创例：零售工人因需求衰退被裁员主要属周期性；某技能被新技术淘汰则主要属结构性。增加总需求可能帮助前者，却不能单独解决后者的技能缺口。自然失业通常包括摩擦性与结构性成分。
    en: "Frictional unemployment comes from job search, structural unemployment from
      skill or location mismatch, cyclical unemployment from weak demand, and
      seasonal unemployment from seasonal activity. Identify the main mechanism;
      separate demand deficiency from matching problems; choose a policy that
      addresses the cause Illustrative example: retail layoffs during a demand
      slump are mainly cyclical; a skill displaced by technology creates mainly
      structural unemployment. Higher AD can help the former without alone
      filling the latter's skill gap. Natural unemployment normally includes
      frictional and structural components."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 技能
        en: skills
      alternatives:
        zh-CN:
          - 技能
          - 识别失业的主要机制
        en:
          - skills
          - Identify the main mechanism
    - id: mechanism-2
      label:
        zh-CN: 匹配
        en: matching
      alternatives:
        zh-CN:
          - 匹配
          - 区分需求不足与匹配问题
        en:
          - matching
          - separate demand deficiency from matching problems
    - id: mechanism-3
      label:
        zh-CN: 需求不足
        en: weak demand
      alternatives:
        zh-CN:
          - 需求不足
          - 选择与成因相符的政策
        en:
          - weak demand
          - choose a policy that addresses the cause
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
