- id: u4-25-managed-exchange-rate-flash-1
  knowledgePointId: u4-25-managed-exchange-rate
  type: flashcard
  prompt:
    zh-CN: 解释“管理浮动与制度比较”，并说明一个关键条件。
    en: Explain Managed floating and regime comparison and state one important
      condition.
  answer:
    zh-CN: 管理浮动允许市场决定汇率，同时当局不定期干预；制度选择权衡稳定性、调整能力与政策自主性。
    en: Managed floating allows market determination with occasional official
      intervention. Regime choice trades off stability, adjustment and policy
      autonomy.
  explanation:
    zh-CN: 固定并非永久稳定，浮动也非完全无干预；应说明实际制度与条件。
    en: Fixed does not mean permanently stable, nor floating entirely
      intervention-free; specify the actual regime and conditions.
- id: u4-25-managed-exchange-rate-mcq-1
  knowledgePointId: u4-25-managed-exchange-rate
  type: mcq
  prompt:
    zh-CN: 管理浮动最符合哪种描述？
    en: Which description fits managed floating?
  options:
    - id: a
      zh-CN: 市场定价加选择性干预
      en: Market pricing with selective intervention
    - id: b
      zh-CN: 永远固定同一平价
      en: Always one fixed parity
    - id: c
      zh-CN: 完全禁止外汇交易
      en: All currency trading banned
    - id: d
      zh-CN: 自动加入货币联盟
      en: Automatic monetary-union membership
  correctOptionId: a
  explanation:
    zh-CN: 市场定价加选择性干预。 原创假设：出口集中且资本流动大的经济体希望减少波动，却不能把有限储备当作无限保证；浮动也可能为外部冲击提供缓冲。
      固定并非永久稳定，浮动也非完全无干预；应说明实际制度与条件。
    en: "Market pricing with selective intervention. Hypothetical scenario: an
      export-concentrated economy with mobile capital wants less volatility but
      cannot treat reserves as unlimited. Floating may cushion external shocks.
      Fixed does not mean permanently stable, nor floating entirely
      intervention-free; specify the actual regime and conditions."
- id: u4-25-managed-exchange-rate-short-1
  knowledgePointId: u4-25-managed-exchange-rate
  type: short-answer
  prompt:
    zh-CN: 解释管理浮动与制度比较的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Managed floating and regime comparison and apply it
      to an example of your own.
  modelAnswer:
    zh-CN: 管理浮动允许市场决定汇率，同时当局不定期干预；制度选择权衡稳定性、调整能力与政策自主性。
      市场冲击引起波动；当局选择性干预；汇率风险与政策成本重新分配
      原创假设：出口集中且资本流动大的经济体希望减少波动，却不能把有限储备当作无限保证；浮动也可能为外部冲击提供缓冲。
    en: "Managed floating allows market determination with occasional official
      intervention. Regime choice trades off stability, adjustment and policy
      autonomy. Market shocks create volatility; authorities intervene
      selectively; exchange risk and policy costs are redistributed Hypothetical
      scenario: an export-concentrated economy with mobile capital wants less
      volatility but cannot treat reserves as unlimited. Floating may cushion
      external shocks."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 市场
        en: market
      alternatives:
        zh-CN:
          - 市场
          - 市场冲击引起波动
        en:
          - market
          - Market shocks create volatility
    - id: mechanism-2
      label:
        zh-CN: 干预
        en: intervention
      alternatives:
        zh-CN:
          - 干预
          - 当局选择性干预
        en:
          - intervention
          - authorities intervene selectively
    - id: mechanism-3
      label:
        zh-CN: 自主性
        en: autonomy
      alternatives:
        zh-CN:
          - 自主性
          - 汇率风险与政策成本重新分配
        en:
          - autonomy
          - exchange risk and policy costs are redistributed
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
