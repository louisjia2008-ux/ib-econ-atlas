- id: u4-13-protection-arguments-flash-1
  knowledgePointId: u4-13-protection-arguments
  type: flashcard
  prompt:
    zh-CN: 解释“就业、安全与反倾销论据”，并说明一个关键条件。
    en: Explain Employment, security and anti-dumping arguments and state one
      important condition.
  answer:
    zh-CN: 贸易保护可维护特定岗位或战略供应，但会提高投入成本、影响出口并可能引发报复；倾销不能仅由低价推断。
    en: Protection may preserve particular jobs or strategic supplies but raises
      input costs, affects exports and risks retaliation. A low price alone does
      not establish dumping.
  explanation:
    zh-CN: 不能把受保护行业岗位当作净就业效果，也不能把低工资直接等同于不公平竞争。
    en: Protected-sector jobs are not the net employment effect; low wages do not by
      themselves establish unfair competition.
- id: u4-13-protection-arguments-mcq-1
  knowledgePointId: u4-13-protection-arguments
  type: mcq
  prompt:
    zh-CN: 钢铁关税评价还应考虑谁？
    en: Whose position also matters in evaluating a steel tariff?
  options:
    - id: a
      zh-CN: 使用钢材的下游企业
      en: Downstream firms using steel
    - id: b
      zh-CN: 仅钢铁生产者
      en: Only steel producers
    - id: c
      zh-CN: 只看关税名称
      en: Only the tariff's name
    - id: d
      zh-CN: 忽略贸易伙伴
      en: Ignore trading partners
  correctOptionId: a
  explanation:
    zh-CN: 使用钢材的下游企业。 原创假设：钢铁关税保住部分炼钢岗位，却提高机械企业成本；评价需比较净就业、供应韧性与再培训方案。
      不能把受保护行业岗位当作净就业效果，也不能把低工资直接等同于不公平竞争。
    en: "Downstream firms using steel. Hypothetical scenario: a steel tariff
      preserves some steel jobs but raises machinery producers' costs. Evaluate
      net jobs, supply resilience and retraining alternatives. Protected-sector
      jobs are not the net employment effect; low wages do not by themselves
      establish unfair competition."
- id: u4-13-protection-arguments-short-1
  knowledgePointId: u4-13-protection-arguments
  type: short-answer
  prompt:
    zh-CN: 解释就业、安全与反倾销论据的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Employment, security and anti-dumping arguments and
      apply it to an example of your own.
  modelAnswer:
    zh-CN: 贸易保护可维护特定岗位或战略供应，但会提高投入成本、影响出口并可能引发报复；倾销不能仅由低价推断。
      进口竞争冲击特定产业；保护减缓调整；下游成本与报复影响其他岗位
      原创假设：钢铁关税保住部分炼钢岗位，却提高机械企业成本；评价需比较净就业、供应韧性与再培训方案。
    en: "Protection may preserve particular jobs or strategic supplies but raises
      input costs, affects exports and risks retaliation. A low price alone does
      not establish dumping. Import competition hits particular industries;
      protection slows adjustment; input costs and retaliation affect jobs
      elsewhere Hypothetical scenario: a steel tariff preserves some steel jobs
      but raises machinery producers' costs. Evaluate net jobs, supply
      resilience and retraining alternatives."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 就业
        en: employment
      alternatives:
        zh-CN:
          - 就业
          - 进口竞争冲击特定产业
        en:
          - employment
          - Import competition hits particular industries
    - id: mechanism-2
      label:
        zh-CN: 成本
        en: costs
      alternatives:
        zh-CN:
          - 成本
          - 保护减缓调整
        en:
          - costs
          - protection slows adjustment
    - id: mechanism-3
      label:
        zh-CN: 报复
        en: retaliation
      alternatives:
        zh-CN:
          - 报复
          - 下游成本与报复影响其他岗位
        en:
          - retaliation
          - input costs and retaliation affect jobs elsewhere
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
