- id: u1-15-free-goods-flash-1
  knowledgePointId: u1-15-free-goods
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“免费物品”。
    en: Without notes, explain “Free goods” in your own words.
  answer:
    zh-CN: 免费物品是数量相对于需求如此充裕，以至于在当前条件下增加使用没有显著机会成本的物品或资源。
    en: A free good is a good or resource so abundant relative to demand that an
      additional unit has no significant opportunity cost under the conditions
      being considered.
  explanation:
    zh-CN: 免费物品在特定时间地点相对于需求足够充裕，取得更多不需要牺牲其他产出；价格为零并不足以证明它是免费物品。
    en: A free good is abundant relative to demand in a particular place and time,
      so obtaining more does not displace another output; a zero price alone is
      not enough.
- id: u1-15-free-goods-mcq-1
  knowledgePointId: u1-15-free-goods
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“免费物品”？
    en: Which statement best captures “Free goods”?
  options:
    - id: a
      zh-CN: 它只描述个人偏好，与资源、制度或社会结果无关。
      en: It concerns personal preference only and has no connection to resources,
        institutions, or social outcomes.
    - id: b
      zh-CN: 它意味着同一种经济结果在任何条件下都会自动出现。
      en: It means the same economic outcome must arise automatically under every set
        of conditions.
    - id: c
      zh-CN: 它是一项只适用于高收入经济体的会计规则。
      en: It is an accounting rule that applies only to high-income economies.
    - id: d
      zh-CN: 免费物品在特定时间地点相对于需求足够充裕，取得更多不需要牺牲其他产出；价格为零并不足以证明它是免费物品。
      en: A free good is abundant relative to demand in a particular place and time,
        so obtaining more does not displace another output; a zero price alone
        is not enough.
  correctOptionId: d
  explanation:
    zh-CN: 免费物品是数量相对于需求如此充裕，以至于在当前条件下增加使用没有显著机会成本的物品或资源。
    en: A free good is a good or resource so abundant relative to demand that an
      additional unit has no significant opportunity cost under the conditions
      being considered.
