    en: Explain the mechanism of Poverty, environment and common resources and apply
      it to an example of your own.
  modelAnswer:
    zh-CN: 贫困可能迫使家庭依赖短期资源开采，环境退化又削弱生计；产权、替代收入和公共服务影响这一循环。
      低收入限制替代选择；过度使用共同资源；资源退化使收入更脆弱
      原创假设：缺乏可靠电力的村庄依赖薪柴，单独禁伐可能伤害穷人；社区管理与清洁能源可同时改善激励和选择。
    en: "Poverty can push households toward short-run resource extraction, while
      degradation undermines livelihoods. Property rights, alternative incomes
