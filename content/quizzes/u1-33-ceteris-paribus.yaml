    en: Ceteris paribus means assuming that relevant influences other than the
      variable under study remain unchanged so that one relationship can be
      analysed separately. An outcome is influenced by several factors; The
      analyst selects one variable of interest; Other influences are temporarily
      held constant; The variable's independent directional effect is derived
      The assumption isolates one relationship.
