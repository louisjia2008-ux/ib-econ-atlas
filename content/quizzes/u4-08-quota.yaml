- id: u4-08-quota-flash-1
  knowledgePointId: u4-08-quota
  type: flashcard
  prompt:
    zh-CN: 解释“进口配额与配额租”，并说明一个关键条件。
    en: Explain Import quotas and quota rents and state one important condition.
  answer:
    zh-CN: 配额直接限制进口数量，通常抬高国内价格；价格差形成配额租，归属取决于许可分配。
    en: A quota directly limits imports and normally raises domestic price. The
      price gap creates quota rents whose recipients depend on licence
      allocation.
  explanation:
    zh-CN: 配额租不会自动归本国政府；需求增加时配额还可能带来更大涨价。
    en: Quota rents do not automatically accrue to the home government; a demand
      increase can further raise price under a fixed quota.
- id: u4-08-quota-mcq-1
  knowledgePointId: u4-08-quota
  type: mcq
  prompt:
    zh-CN: 配额许可免费给外国出口商，租最可能归谁？
    en: Who may receive rents if quota licences are freely given to foreign
      exporters?
  options:
    - id: a
      zh-CN: 必定归本国财政
      en: Always the home treasury
    - id: b
      zh-CN: 必定归所有消费者
      en: Always all consumers
    - id: c
      zh-CN: 租必定为零
      en: Rents must be zero
    - id: d
      zh-CN: 外国许可证持有人
      en: Foreign licence holders
  correctOptionId: d
  explanation:
    zh-CN: 外国许可证持有人。 原创假设：世界价 10、国内价 14，配额 30，配额租为
      120。政府拍卖许可可能获得收入，免费给外国出口商则租可能流向国外。 配额租不会自动归本国政府；需求增加时配额还可能带来更大涨价。
    en: "Foreign licence holders. Hypothetical scenario: world price ten, domestic
      price fourteen and quota thirty create rents of 120. Auctions may generate
      public revenue; free licences to foreign exporters can transfer rents
      abroad. Quota rents do not automatically accrue to the home government; a
      demand increase can further raise price under a fixed quota."
- id: u4-08-quota-short-1
  knowledgePointId: u4-08-quota
  type: short-answer
  prompt:
    zh-CN: 解释进口配额与配额租的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Import quotas and quota rents and apply it to an
      example of your own.
  modelAnswer:
    zh-CN: 配额直接限制进口数量，通常抬高国内价格；价格差形成配额租，归属取决于许可分配。 进口数量受限；国内稀缺性推高价格；许可证持有人获得配额租
      原创假设：世界价 10、国内价 14，配额 30，配额租为 120。政府拍卖许可可能获得收入，免费给外国出口商则租可能流向国外。
    en: "A quota directly limits imports and normally raises domestic price. The
      price gap creates quota rents whose recipients depend on licence
      allocation. Imports are capped; scarcity raises domestic price; licence
      holders receive quota rents Hypothetical scenario: world price ten,
      domestic price fourteen and quota thirty create rents of 120. Auctions may
      generate public revenue; free licences to foreign exporters can transfer
      rents abroad."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 数量
        en: quantity
      alternatives:
        zh-CN:
          - 数量
          - 进口数量受限
        en:
          - quantity
          - Imports are capped
    - id: mechanism-2
      label:
        zh-CN: 许可证
        en: licences
      alternatives:
        zh-CN:
          - 许可证
          - 国内稀缺性推高价格
        en:
          - licences
          - scarcity raises domestic price
    - id: mechanism-3
      label:
        zh-CN: 配额租
        en: quota rents
      alternatives:
        zh-CN:
          - 配额租
          - 许可证持有人获得配额租
        en:
          - quota rents
          - licence holders receive quota rents
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
      causation and application, then override the judgement if needed.
