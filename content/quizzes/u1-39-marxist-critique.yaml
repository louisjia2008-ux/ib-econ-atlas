- id: u1-39-marxist-critique-flash-1
  knowledgePointId: u1-39-marxist-critique
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“马克思主义批判”。
    en: Without notes, explain “The Marxist critique” in your own words.
  answer:
    zh-CN: 马克思主义经济批判以生产资料所有权、劳动与资本的阶级关系、剩余价值和资本积累为框架，分析资本主义的分配、权力与危机倾向。
    en: The Marxist critique uses ownership of the means of production, class
      relations between labour and capital, surplus value, and accumulation to
      analyse distribution, power, and tendencies toward crisis in capitalism.
  explanation:
    zh-CN: 马克思主义分析把所有权、阶级关系和资本积累置于核心，质疑市场交换表面的自由是否掩盖生产权力与分配冲突。
    en: Marxist analysis centres ownership, class relations, and capital
      accumulation, questioning whether formal freedom in exchange conceals
      power and distributional conflict in production.
- id: u1-39-marxist-critique-mcq-1
