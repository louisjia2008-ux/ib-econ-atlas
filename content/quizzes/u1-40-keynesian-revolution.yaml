- id: u1-40-keynesian-revolution-short-1
  knowledgePointId: u1-40-keynesian-revolution
  type: short-answer
  prompt:
    zh-CN: 简要解释“凯恩斯革命与宏观政策”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “The Keynesian revolution and macroeconomic policy”,
      including one causal mechanism and one important implication.
  modelAnswer:
    zh-CN: 凯恩斯革命与宏观政策：凯恩斯主义认为支出、预期和价格工资刚性会决定短期产出与就业；当私人需求不足且自我调整缓慢时，公共政策可支持总需求。
      悲观预期减少消费或投资；总需求下降使企业减产和裁员；收入下降进一步压低支出；逆周期财政或货币政策尝试打破收缩循环 总需求可以持续低于充分就业水平。
    en: "The Keynesian revolution and macroeconomic policy: Keynesian economics
      holds that expenditure, expectations, and wage-price rigidity influence
      short-run output and employment, and that public policy can support
      aggregate demand when private demand is weak and self-correction is slow.
      Pessimistic expectations reduce consumption or investment; Lower aggregate
      demand causes firms to cut output and jobs; Falling income further reduces
      expenditure; Countercyclical fiscal or monetary policy seeks to interrupt
      the contraction Aggregate demand can remain below full-employment output."
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
        zh-CN:
          - 凯恩斯革命与宏观政策
          - 凯恩斯主义
          - 有效需求
          - 需求管理
        en:
          - The Keynesian revolution and macroeconomic policy
          - Keynesianism
          - effective demand
          - demand management
    - id: mechanism
      label:
        zh-CN: 因果机制
        en: Causal mechanism
      alternatives:
        zh-CN:
          - 悲观预期减少消费或投资
          - 总需求下降使企业减产和裁员
        en:
          - Pessimistic expectations reduce consumption or investment
          - Lower aggregate demand causes firms to cut output and jobs
    - id: implication
      label:
        zh-CN: 重要含义
        en: Important implication
      alternatives:
        zh-CN:
          - 总需求可以持续低于充分就业水平。
          - 工资价格刚性减慢自我调整。
        en:
          - Aggregate demand can remain below full-employment output.
          - Sticky wages and prices slow self-correction.
  explanation:
    zh-CN: 系统按核心概念、因果机制和重要含义三个关键词组计算覆盖率；你可以查看依据并手动修正最终判定。
    en: Coverage is calculated across the core concept, causal mechanism, and
      implication groups; you can inspect and override the final judgement.
