- id: u1-27-ppc-unemployment-efficiency-flash-1
  knowledgePointId: u1-27-ppc-unemployment-efficiency
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“PPC中的失业与生产效率”。
    en: Without notes, explain “Unemployment and efficiency on a PPC” in your own
      words.
  answer:
    zh-CN: PPC 内部的点代表失业、闲置或低效配置使实际产出低于最大可能；曲线上的点代表既定资源和技术下的生产效率。
    en: A point inside a PPC represents actual output below the feasible maximum
      because of unemployment, idle capacity, or inefficient allocation, while a
      point on the curve represents productive efficiency for the given
      resources and technology.
  explanation:
    zh-CN: 曲线内点表示当前能力未被充分或有效使用，曲线上点表示生产效率；回到边界可增加一种或两种产出。
    en: A point inside the PPC indicates that current capacity is underused or used
      inefficiently; a point on the line is productively efficient, and
      returning to it can raise one or both outputs.
- id: u1-27-ppc-unemployment-efficiency-mcq-1
  knowledgePointId: u1-27-ppc-unemployment-efficiency
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“PPC中的失业与生产效率”？
    en: Which statement best captures “Unemployment and efficiency on a PPC”?
  options:
    - id: a
      zh-CN: PPC 内点证明资源已完全有效使用
      en: An interior point proves full efficient resource use
    - id: b
      zh-CN: 边界上每一点都同时保证配置效率
      en: Every frontier point guarantees allocative efficiency
    - id: c
      zh-CN: 失业只能表现为 PPC 必定外移
      en: Unemployment can only shift a PPC outward
    - id: d
      zh-CN: 曲线内点表示当前能力未被充分或有效使用，曲线上点表示生产效率；回到边界可增加一种或两种产出。
      en: A point inside the PPC indicates that current capacity is underused or used
        inefficiently; a point on the line is productively efficient, and
        returning to it can raise one or both outputs.
  correctOptionId: d
  explanation:
    zh-CN: PPC 内部的点代表失业、闲置或低效配置使实际产出低于最大可能；曲线上的点代表既定资源和技术下的生产效率。
    en: A point inside a PPC represents actual output below the feasible maximum
      because of unemployment, idle capacity, or inefficient allocation, while a
      point on the curve represents productive efficiency for the given
      resources and technology.
- id: u1-27-ppc-unemployment-efficiency-short-1
  knowledgePointId: u1-27-ppc-unemployment-efficiency
  type: short-answer
  prompt:
    zh-CN: 简要解释“PPC中的失业与生产效率”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “Unemployment and efficiency on a PPC”, including one causal
      mechanism and one important implication.
  modelAnswer:
    zh-CN: PPC中的失业与生产效率：PPC 内部的点代表失业、闲置或低效配置使实际产出低于最大可能；曲线上的点代表既定资源和技术下的生产效率。
      部分劳动或资本闲置或错配；实际产出落在生产边界以内；需求恢复、再培训或管理改善提高利用率；经济体移向边界并实现实际增长 曲线内表示未充分利用或低效。
    en: "Unemployment and efficiency on a PPC: A point inside a PPC represents
      actual output below the feasible maximum because of unemployment, idle
      capacity, or inefficient allocation, while a point on the curve represents
      productive efficiency for the given resources and technology. Some labour
      or capital is idle or mismatched; Actual output lies within the production
      boundary; Recovery, retraining, or better management raises utilisation;
      The economy moves toward the frontier and actual output grows Inside the
      curve indicates underuse or inefficiency."
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
        zh-CN:
          - PPC中的失业与生产效率
          - PPC失业
          - 生产低效
          - inside the PPC
        en:
          - Unemployment and efficiency on a PPC
          - PPC unemployment
