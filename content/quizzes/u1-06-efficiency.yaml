- id: u1-06-efficiency-flash-1
  knowledgePointId: u1-06-efficiency
  type: flashcard
  prompt:
    zh-CN: 不看笔记，用自己的话解释“效率”。
    en: Without notes, explain “Efficiency” in your own words.
  answer:
    zh-CN: 经济效率描述资源没有被浪费，并在可能范围内被配置到能够产生较大价值或满足较多需求的用途；常区分生产效率与配置效率。
    en: Economic efficiency describes a situation in which resources are not wasted
      and, as far as possible, are allocated to uses that create greater value
      or satisfy more highly valued wants; productive and allocative efficiency
      are commonly distinguished.
  explanation:
    zh-CN: 效率意味着在既定资源下避免浪费并把资源用于社会最重视的用途，但它不自动保证公平。
    en: Efficiency avoids waste and directs scarce resources toward valued uses, but
      an efficient outcome is not automatically equitable.
- id: u1-06-efficiency-mcq-1
  knowledgePointId: u1-06-efficiency
  type: mcq
  prompt:
    zh-CN: 下列哪一项最准确地概括“效率”？
    en: Which statement best captures “Efficiency”?
  options:
    - id: a
      zh-CN: 它只描述个人偏好，与资源、制度或社会结果无关。
      en: It concerns personal preference only and has no connection to resources,
        institutions, or social outcomes.
    - id: b
      zh-CN: 它意味着同一种经济结果在任何条件下都会自动出现。
      en: It means the same economic outcome must arise automatically under every set
        of conditions.
    - id: c
      zh-CN: 效率意味着在既定资源下避免浪费并把资源用于社会最重视的用途，但它不自动保证公平。
      en: Efficiency avoids waste and directs scarce resources toward valued uses, but
        an efficient outcome is not automatically equitable.
    - id: d
      zh-CN: 它是一项只适用于高收入经济体的会计规则。
      en: It is an accounting rule that applies only to high-income economies.
  correctOptionId: c
  explanation:
    zh-CN: 经济效率描述资源没有被浪费，并在可能范围内被配置到能够产生较大价值或满足较多需求的用途；常区分生产效率与配置效率。
    en: Economic efficiency describes a situation in which resources are not wasted
      and, as far as possible, are allocated to uses that create greater value
      or satisfy more highly valued wants; productive and allocative efficiency
      are commonly distinguished.
- id: u1-06-efficiency-short-1
  knowledgePointId: u1-06-efficiency
  type: short-answer
  prompt:
    zh-CN: 简要解释“效率”，并写出一条因果机制和一个重要含义。
    en: Briefly explain “Efficiency”, including one causal mechanism and one
      important implication.
  modelAnswer:
    zh-CN: 经济效率描述资源没有被浪费，并在可能范围内被配置到能够产生较大价值或满足较多需求的用途；常区分生产效率与配置效率。
      识别有限投入与可能产出；减少闲置和不必要的投入损耗；把生产组合调整到可行边界；再比较产出组合是否符合社会偏好 生产效率关注避免投入浪费。
    en: Economic efficiency describes a situation in which resources are not wasted
      and, as far as possible, are allocated to uses that create greater value
      or satisfy more highly valued wants; productive and allocative efficiency
      are commonly distinguished. Identify scarce inputs and feasible outputs;
      Remove idle capacity and unnecessary input loss; Move production to the
      feasible frontier; Ask whether the output mix reflects social preferences
      Productive efficiency concerns avoiding input waste.
  keywordGroups:
    - id: concept
      label:
        zh-CN: 核心概念
        en: Core concept
      alternatives:
        zh-CN:
          - 效率
          - 经济效率
          - 生产效率
          - 配置效率
        en:
          - Efficiency
          - economic efficiency
          - productive efficiency
          - allocative efficiency
    - id: mechanism
      label:
        zh-CN: 因果机制
        en: Causal mechanism
      alternatives:
        zh-CN:
          - 识别有限投入与可能产出
          - 减少闲置和不必要的投入损耗
        en:
          - Identify scarce inputs and feasible outputs
          - Remove idle capacity and unnecessary input loss
    - id: implication
      label:
        zh-CN: 重要含义
        en: Important implication
      alternatives:
        zh-CN:
          - 生产效率关注避免投入浪费。
          - 配置效率关注产出是否符合偏好。
        en:
          - Productive efficiency concerns avoiding input waste.
          - Allocative efficiency concerns the preferred output mix.
  explanation:
    zh-CN: 系统按核心概念、因果机制和重要含义三个关键词组计算覆盖率；你可以查看依据并手动修正最终判定。
    en: Coverage is calculated across the core concept, causal mechanism, and
      implication groups; you can inspect and override the final judgement.
