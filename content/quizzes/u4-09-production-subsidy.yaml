- id: u4-09-production-subsidy-flash-1
  knowledgePointId: u4-09-production-subsidy
  type: flashcard
  prompt:
    zh-CN: 解释“生产补贴与进口替代”，并说明一个关键条件。
    en: Explain Production subsidies and import displacement and state one important
      condition.
  answer:
    zh-CN: 小国对国内生产提供补贴可增加国内供给、减少进口；消费者仍按世界价购买，财政承担补贴成本。
    en: A domestic production subsidy in a small economy can increase domestic
      supply and reduce imports. Consumers still buy at the world price and the
      government funds the subsidy.
  explanation:
    zh-CN: 补贴未必提高消费者价格；政府机会成本与低效率生产仍需评价。
    en: A subsidy need not raise consumer price; fiscal opportunity cost and
      inefficient production still matter.
- id: u4-09-production-subsidy-mcq-1
  knowledgePointId: u4-09-production-subsidy
  type: mcq
  prompt:
    zh-CN: 补贴 4，补贴后国内总产量 30，财政成本？
    en: A subsidy of four on total domestic output of thirty costs how much?
  options:
    - id: a
      zh-CN: "120"
      en: "120"
    - id: b
      zh-CN: 仅补新增产量
      en: Only subsidise additional output
    - id: c
      zh-CN: "34"
      en: "34"
    - id: d
      zh-CN: "26"
      en: "26"
  correctOptionId: a
  explanation:
    zh-CN: 120。 原创假设：补贴 2、国内产量由 40 增至 60，总成本 120，而非仅对新增 20 单位补贴。模型假定持续进口且世界价不变。
      补贴未必提高消费者价格；政府机会成本与低效率生产仍需评价。
    en: "120. Hypothetical scenario: a subsidy of two raises domestic output from
      forty to sixty, costing 120, not merely subsidising the twenty extra
      units. Imports remain positive and the world price is fixed. A subsidy
      need not raise consumer price; fiscal opportunity cost and inefficient
      production still matter."
- id: u4-09-production-subsidy-short-1
  knowledgePointId: u4-09-production-subsidy
  type: short-answer
  prompt:
    zh-CN: 解释生产补贴与进口替代的机制，并用一个自己设计的情境说明其含义。
    en: Explain the mechanism of Production subsidies and import displacement and
      apply it to an example of your own.
  modelAnswer:
    zh-CN: 小国对国内生产提供补贴可增加国内供给、减少进口；消费者仍按世界价购买，财政承担补贴成本。
      生产者每单位净收入增加；国内供给扩大；进口减少但消费价不必提高 原创假设：补贴 2、国内产量由 40 增至 60，总成本 120，而非仅对新增 20
      单位补贴。模型假定持续进口且世界价不变。
    en: "A domestic production subsidy in a small economy can increase domestic
      supply and reduce imports. Consumers still buy at the world price and the
      government funds the subsidy. Producer receipts per unit rise; domestic
      supply expands; imports fall without a necessary rise in consumer price
      Hypothetical scenario: a subsidy of two raises domestic output from forty
      to sixty, costing 120, not merely subsidising the twenty extra units.
      Imports remain positive and the world price is fixed."
  keywordGroups:
    - id: mechanism-1
      label:
        zh-CN: 补贴
        en: subsidy
      alternatives:
        zh-CN:
          - 补贴
          - 生产者每单位净收入增加
        en:
          - subsidy
          - Producer receipts per unit rise
    - id: mechanism-2
      label:
        zh-CN: 供给
        en: supply
      alternatives:
        zh-CN:
          - 供给
          - 国内供给扩大
        en:
          - supply
          - domestic supply expands
    - id: mechanism-3
      label:
        zh-CN: 财政成本
        en: fiscal cost
      alternatives:
        zh-CN:
          - 财政成本
          - 进口减少但消费价不必提高
        en:
          - fiscal cost
          - imports fall without a necessary rise in consumer price
  explanation:
    zh-CN: 关键词覆盖是辅助提示，不是 IB 官方评分。检查条件、因果关系和情境应用后，可手动修正判定。
    en: Keyword coverage is a study aid, not official IB marking. Check assumptions,
