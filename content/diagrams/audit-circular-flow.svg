<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="title"><title id="title">Circular flow: real and money flows</title><rect width="660" height="340" fill="white"/><g font-family="system-ui,sans-serif" font-size="16" fill="#17233b"><text x="25" y="30">Households and firms, with other-sector links</text><rect x="35" y="125" width="140" height="80" rx="8" fill="#e7efff"/><rect x="485" y="125" width="140" height="80" rx="8" fill="#e7efff"/><text x="60" y="170">Households</text><text x="535" y="170">Firms</text><text x="200" y="75">Factors of production →</text><text x="200" y="105">← Wages, rent, interest, profit</text><text x="200" y="225">← Goods and services</text><text x="200" y="255">Consumption spending →</text><text x="30" y="300">Leakages: saving, taxes, imports | Injections: investment, G, exports</text><text x="30" y="325" font-size="13">Finance, government and foreign-sector links extend the two-sector model.</text></g></svg>
