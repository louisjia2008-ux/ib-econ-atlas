<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-labelledby="title"><title id="title">A possible reinforcing poverty cycle</title><rect width="660" height="320" fill="white"/><g font-family="system-ui,sans-serif" font-size="18" text-anchor="middle" fill="#17233b"><text x="330" y="35">A possible reinforcing poverty cycle</text><text x="180" y="100">Low income</text><text x="480" y="100">Low saving</text><text x="480" y="240">Low investment</text><text x="180" y="240">Low productivity</text></g><g fill="#2454d8" font-size="30"><text x="320" y="105">→</text><text x="470" y="175">↓</text><text x="320" y="245">←</text><text x="170" y="175">↑</text></g><text x="40" y="295" font-family="system-ui,sans-serif" font-size="14">Not inevitable: finance, public services and institutions can interrupt the cycle.</text></svg>
