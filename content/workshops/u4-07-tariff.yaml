title:
  zh-CN: 关税学习工坊
  en: Tariff learning workshop
introduction:
  zh-CN: 先画图，再练解释与评价。所有题目和参考答案均为 Atlas 原创；分值仅说明练习规模，自评清单不是 IB 官方评分，也没有自动语义阅卷。
  en: Draw first, then practise explanation and evaluation. These are original
    Atlas tasks and model answers. Marks indicate task size; the checklist is
    not official IB marking or automated semantic assessment.
assumptions:
  zh-CN: 假定本国是世界价格接受者；商品同质、市场竞争，世界供给在 Pw 处完全有弹性，无运输成本、外部性或报复；关税后仍有正进口。这里只看本国该市场的静态总剩余。
  en: Assume a price-taking small economy, homogeneous goods and competitive
    markets, perfectly elastic world supply at Pw, no transport costs,
    externalities or retaliation, and positive imports after the tariff. Welfare
    here means static domestic surplus in this market.
diagram:
  prompt:
    zh-CN: 不看参考图，画出小国单位关税：标出 D、S、Pw、Pw+t、四个数量、税收及两个净损失区域。可在画布或纸上完成。
    en: "Without the reference, draw a small-country specific tariff: label D, S,
      prices, four quantities, revenue and the two deadweight losses. Use the
      canvas or paper."
  criteria:
    - id: axes
      title:
        zh-CN: 坐标轴与曲线
        en: Axes and curves
      guidance:
        zh-CN: 纵轴是价格，横轴是本国产量；D 向下、S 向上，并准确标注。
        en: Price is vertical and domestic quantity horizontal; label downward D and
          upward S.
      feedback:
        zh-CN: 检查是否把微观价格写成物价水平；国内供需曲线在征税前后保持不变。
        en: Check for confusion with the macro price level; domestic D and S remain
          unchanged.
    - id: prices
      title:
        zh-CN: 两条价格线
        en: Two price lines
      guidance:
        zh-CN: Pw 与 Pw+t 水平，Pw+t 高于 Pw，且低于自给均衡价，税后仍有进口。
        en: Both prices are horizontal, Pw+t above Pw and below autarky, retaining
          imports.
      feedback:
        zh-CN: 若税后价超过自给价，就不能继续使用本例“仍有进口”的数量与税收。
        en: A price above autarky invalidates this continued-import example.
    - id: quantities
      title:
        zh-CN: 四个数量与进口差额
        en: Four quantities and import gaps
      guidance:
        zh-CN: 从曲线交点投影出 Qs0<Qs1<Qd1<Qd0，分别写出税前、税后进口。
        en: Project intersections onto Qs0<Qs1<Qd1<Qd0 and identify both import gaps.
      feedback:
        zh-CN: 把税后进口写成 Qd1−Qs1；不要用国内总需求代替进口。
        en: Use Qd1−Qs1 for post-tariff imports, not total domestic demand.
    - id: welfare
      title:
        zh-CN: 福利区域及解释
        en: Welfare areas and interpretation
      guidance:
        zh-CN: 标出政府税收 c、生产扭曲 b 与消费扭曲 d，并解释它们代表什么。
        en: Identify revenue c, production loss b and consumption loss d, and explain
          each.
      feedback:
        zh-CN: c 是税后进口宽度乘税高的矩形；b+d 是净损失，不是税收。
        en: Rectangle c uses post-tariff imports; b+d is lost welfare rather than
          revenue.
tasks:
  - id: explain
    marks: 10
    minutes: 18
    level: core
    title:
      zh-CN: 10 分解释题
      en: 10-mark explanation
    prompt:
      zh-CN: 借助图示，解释小国对进口商品征收单位关税如何影响消费者、国内生产者及政府。说明你的假设。
      en: Using a diagram, explain how a specific import tariff affects consumers,
        domestic producers and government in a small economy. State your
        assumptions.
    criteria:
      - id: model
        title:
          zh-CN: 概念与条件
          en: Concept and assumptions
        guidance:
          zh-CN: 定义单位关税，明确小国、仍有进口等条件。
          en: Define a specific tariff and state price-taking and continued-import
            assumptions.
        feedback:
          zh-CN: 先解释为什么世界价不变、国内价升至 Pw+t，不能只背结论。
          en: Explain why Pw stays fixed and domestic price reaches Pw+t.
      - id: diagram
        title:
          zh-CN: 图文对应
          en: Diagram integration
        guidance:
          zh-CN: 用自己的图解释两个价格、四个数量和缩小的进口差额。
          en: Use your diagram to explain prices, quantities and the smaller import gap.
        feedback:
          zh-CN: 在文字中引用图上标记，说明沿 D/S 移动，避免图文互相矛盾。
          en: Refer to labels and movements along D/S, keeping diagram and prose
            consistent.
      - id: stakeholders
        title:
          zh-CN: 利益相关者与因果
          en: Stakeholders and causation
        guidance:
          zh-CN: 解释消费者损失、生产者收益、政府税收和净福利变化。
          en: Explain consumer loss, producer gain, revenue and net welfare.
        feedback:
          zh-CN: 写出“价格改变→行为改变→剩余变化”的链条；收入转移与效率损失要区分。
          en: Connect price, behaviour and surplus; distinguish transfers from efficiency
            losses.
    modelAnswer:
      zh-CN: >-
        单位关税是对每单位进口商品征收固定金额的税。假设本国是价格接受者、商品同质、市场竞争，且征税后仍有进口，世界价 Pw 不变，国内价由 Pw 升到
        Pw+t。


        在图中画出向下 D、向上 S 和两条水平价格线。国内企业因价格提高沿 S 将供给从 Qs0 增至 Qs1；消费者沿 D 把需求从 Qd0 减至
        Qd1。因此进口从 Qd0−Qs0 缩小到 Qd1−Qs1。这是国内曲线上的移动，不是偏好或技术改变导致的曲线移动。


        消费者支付更高价格且消费减少，剩余减少 a+b+c+d。生产者因价格、产量上升获得 a；政府只对税后进口征税，取得
        c=t×(Qd1−Qs1)。把三者变化相加，a 与 c 是国内转移，留下 b+d 的净损失。b 表示用较高成本本国产出替代较低成本进口，d
        表示原本收益高于 Pw 的消费不再发生。


        此结论限于无外部性等假设下的该市场静态国内福利；若要判断供应安全或长期就业，还需进一步证据。
      en: >-
        A specific tariff is a fixed tax per imported unit. Assume a
        price-taking economy, homogeneous goods, competitive markets and
        continued imports. Pw remains fixed, while domestic price rises to Pw+t.


        Draw downward D, upward S and the two horizontal price lines. The higher
        price raises domestic supply from Qs0 to Qs1 along S and reduces
        consumption from Qd0 to Qd1 along D. Imports therefore fall from Qd0−Qs0
        to Qd1−Qs1. These are movements along unchanged domestic curves.


        Consumers pay more and purchase less, losing surplus a+b+c+d. Producers
        gain a through the higher price and output. Government collects
        c=t×(Qd1−Qs1) on the imports that remain. Adding these changes cancels
        domestic transfers a and c, leaving losses b+d. Area b is the extra
        resource cost of replacing imports with higher-cost domestic output; d
        is the lost benefit of consumption valued above Pw but below the new
        price.


        This is a static domestic-welfare conclusion under the stated
        assumptions. Supply-security benefits or long-run employment effects
        require additional evidence.
    weakAnswer:
      zh-CN: 关税使进口减少，政府有税收，所以所有人都会受益。
      en: Tariffs reduce imports and raise revenue, so everyone benefits.
    diagnosis:
      zh-CN: 遗漏价格如何影响数量，没有图文对应，把政府转移收入误当成所有人的净收益；补上消费者损失以及 b+d 的含义。
      en: It omits the price-to-quantity mechanism and diagram integration, and
        mistakes revenue for a gain to everyone. Explain consumer losses and
        b+d.
  - id: evaluate
    marks: 15
    minutes: 27
    level: core
    title:
      zh-CN: 15 分评价题
      en: 15-mark evaluation
    prompt:
      zh-CN: 运用一个真实世界案例，评价关税在保护国内就业方面的有效性。
      en: Using a real-world example, evaluate the effectiveness of tariffs in
        protecting domestic employment.
    criteria:
      - id: application
        title:
          zh-CN: 现实证据及范围
          en: Evidence and scope
        guidance:
          zh-CN: 准确使用美国钢材案例，交代时期和来源，避免用产量数据直接证明就业增长。
          en: Apply the dated US steel evidence without treating output as measured
            employment.
        feedback:
          zh-CN: 案例必须支持论点；报告没有估计整体净福利或长期安全收益。
          en: Use evidence to support the argument within the report’s scope.
      - id: balance
        title:
          zh-CN: 分析相互冲突的影响
          en: Analyse competing effects
        guidance:
          zh-CN: 比较受保护企业、消费者、下游企业和可能受报复的出口商。
          en: Compare protected firms, consumers, downstream users and potentially
            affected exporters.
        feedback:
          zh-CN: 不能只列“优缺点”；解释成本如何传导，以及不同群体为何结果不同。
          en: Explain transmission and distribution rather than listing advantages and
            disadvantages.
      - id: conditions
        title:
          zh-CN: 条件与替代方案
          en: Conditions and alternatives
        guidance:
          zh-CN: 讨论弹性、时间、外部性或安全目标，并比较培训等替代措施。
          en: Discuss elasticities, time or security/externality objectives, and compare
            alternatives such as training.
        feedback:
          zh-CN: 把“取决于”展开：什么条件会改变你的结论，替代方案如何针对问题？
          en: Explain which conditions change the judgement and how an alternative targets
            the problem.
      - id: judgement
        title:
          zh-CN: 有依据的结论
          en: Supported judgement
        guidance:
          zh-CN: 明确什么情况下保护就业的收益可能值得成本，并承认数据限制。
          en: Judge when employment protection could justify its costs, acknowledging
            evidence limits.
        feedback:
          zh-CN: 结论应权衡目标与代价；避免“关税永远好／永远坏”的无条件判断。
          en: Weigh the objective against costs and avoid unconditional claims.
    modelAnswer:
      zh-CN: |-
        关税提高进口的国内成本，使部分消费者转向本国产品，因此可支持受保护行业的产量与劳动需求。小国模型中，Pw+t 下 Qs1 高于 Qs0，这说明保护可能发挥作用的机制，但图示本身没有测量就业。

        美国 USITC 2023 年报告对 2018–2021 年的估计显示，232 条款关税使受影响钢材进口下降 24%、美国钢材价格上升 2.4%、产量上升 1.9%。这些证据支持“进口受抑制、本国产出增加”的分析。但产量增长可能来自更多工时、自动化或闲置设备利用，不能把 1.9% 直接写成就业增长率。美国具有影响世界市场的能力，也不能被视作小国模型的严格实例。

        更高钢材价格会提高使用钢材的企业成本，削弱其竞争力，可能抵消部分受保护岗位的收益。报告估计使用钢铝的下游行业产量平均下降 0.6%，提醒我们把保护行业和下游行业一起评价。消费者也承担较高价格；若贸易伙伴报复，其他出口行业可能受损。这些效果需要独立分析，不能把行业产量变化或税收直接称为全国净福利变化。

        短期内，劳动力难以转移、地区高度依赖钢铁业时，暂时保护可能减轻调整冲击；但长期保护若削弱竞争、维持低效企业，成本可能持续增加。若目标是学习外部性或战略供应，应提供具体证据、明确期限与退出条件，并比较培训、工资保险或针对性的产业支持。培训可能更直接针对技能错配，但见效较慢，也需要资金。

        因此，关税可能在特定行业短期支持就业，却不能由此认定它是保护总体就业的最佳工具。政策是否值得采取，取决于行业联系、调整速度、长期能力、报复风险和替代措施。所用报告不评估长期安全收益或全经济净效果；在证据有限时，我更支持目标明确、有期限并配合转岗支持的措施，而非无限期全面保护。
      en: >-
        Tariffs raise the domestic cost of imports and can redirect spending
        towards local producers, supporting output and labour demand in a
        protected industry. In the small-country diagram, domestic supply rises
        from Qs0 to Qs1 at Pw+t. This explains a possible mechanism, but the
        diagram does not measure jobs.


        The 2023 USITC report estimated effects during 2018–2021: section 232
        tariffs reduced affected steel imports by 24%, raised US steel prices by
        2.4% and raised output by 1.9%. This supports the mechanism of
        restricted imports and greater domestic output. However, output may rise
        through hours, automation or spare-capacity use; 1.9% is not an
        employment-growth estimate. Nor should the US be treated as a strict
        price-taking small economy.


        Higher steel prices increase downstream costs and may offset some
        employment gains in protected production. The report estimated a 0.6%
        average output decline in downstream steel- and aluminium-using
        industries. Consumers face higher prices, while retaliation could hurt
        other exporters. These effects require analysis across stakeholders.
        Neither industry output changes nor tariff revenue directly establish
        national net welfare.


        Temporary protection may soften adjustment where workers cannot move
        easily and a region depends on steel. Over time, however, weaker
        competitive pressure can sustain inefficient firms and prolong costs. If
        learning spillovers or strategic supply justify intervention, identify
        evidence, a time limit and exit conditions. Compare retraining, wage
        insurance and targeted support. Retraining can address skill mismatch
        more directly, but takes time and public funds.


        Tariffs may therefore support particular jobs in the short run without
        being the best instrument for aggregate employment. Effectiveness
        depends on industry linkages, adjustment, long-run capability,
        retaliation and alternatives. The cited report does not establish
        long-run security benefits or economy-wide net effects. Given these
        limits, a targeted, time-limited response with transition support is
        more defensible than indefinite broad protection.
    weakAnswer:
      zh-CN: 美国钢材产量增长 1.9%，所以美国就业增长 1.9%，证明关税对所有国家都有效。
      en: US steel output rose 1.9%, so US employment rose 1.9%, proving tariffs work
        for every country.
    diagnosis:
      zh-CN: 把产量误写成就业，把行业误写成全国，把历史特定情境推广到所有国家。应注明指标和时期，分析下游成本、条件与替代政策。
      en: It conflates output with employment, an industry with the whole economy, and
        a historical case with all countries. Preserve the indicator and period,
        then analyse downstream costs, conditions and alternatives.
  - id: calculate
    marks: 10
    minutes: 12
    level: hl
    title:
      zh-CN: HL 计算与解释
      en: HL calculation and interpretation
    prompt:
      zh-CN: 原创线性情境：Pw=10、t=2；税前 Qs0=30、Qd0=110，税后
        Qs1=50、Qd1=90。计算税前后进口、税收、两种扭曲损失，以及消费者和生产者剩余变化；验证净福利变化。写出步骤和单位。
      en: "Original linear example: Pw=10, t=2; before the tariff Qs0=30, Qd0=110;
        afterwards Qs1=50, Qd1=90. Calculate imports, revenue, both distortion
        losses and changes in consumer/producer surplus, then reconcile net
        welfare. Show workings and units."
    criteria:
      - id: imports
        title:
          zh-CN: 数量与税基
          en: Quantities and tax base
        guidance:
          zh-CN: 进口 80→40 单位，税收 80 货币。
          en: Imports 80→40 units; revenue 80 currency units.
        feedback:
          zh-CN: 税率乘税后进口，不能乘 Qd1 或税前进口。
          en: Multiply the tariff by post-tariff imports, not Qd1 or initial imports.
      - id: areas
        title:
          zh-CN: 面积与净福利
          en: Areas and net welfare
        guidance:
          zh-CN: b=20，d=20，生产者 +80，消费者 −200，合计 −40 货币。
          en: b=20, d=20, producers +80, consumers −200; total −40 currency units.
        feedback:
          zh-CN: 写出三角形或梯形公式、负号与单位，解释收入转移为何抵消。
          en: Show triangle/trapezium workings, signs and units, and explain cancellation
            of transfers.
    modelAnswer:
      zh-CN: 原创线性情境：Pw=10，t=2；自由贸易 Qs0=30、Qd0=110，税后 Qs1=50、Qd1=90。进口由 80 降为 40；政府税收
        c=2×40=80。生产扭曲 b=½×2×(50−30)=20；消费扭曲 d=½×2×(110−90)=20；净福利变化 −40。生产者剩余增量
        a=½×(30+50)×2=80；消费者剩余减少
        ½×(110+90)×2=200；−200+80+80=−40。数量以单位、价格以货币/单位计，剩余以货币计。三角形与梯形算法依赖线性曲线；税收和转移不能重复相加。
      en: "Original linear example: Pw=10 and t=2. Free-trade Qs0=30 and Qd0=110;
        post-tariff Qs1=50 and Qd1=90. Imports fall from 80 to 40; revenue
        c=2×40=80. Production loss b=½×2×(50−30)=20 and consumption loss
        d=½×2×(110−90)=20, giving net welfare change −40. Producer surplus rises
        by a=½×(30+50)×2=80. Consumer surplus falls by ½×(110+90)×2=200;
        −200+80+80=−40. Quantities are units, prices currency per unit and
        surplus currency. Triangle and trapezium calculations assume linear
        curves; avoid double-counting transfers."
    weakAnswer:
      zh-CN: 税收=2×110=220，所以福利增加 220。
      en: Revenue=2×110=220, so welfare rises by 220.
    diagnosis:
      zh-CN: 110 是税前需求，既不是税后进口也不是净福利。税收为 2×(90−50)=80；净福利变化为 −40。
      en: 110 is initial demand, neither post-tariff imports nor net welfare. Revenue
        is 2×(90−50)=80 and net welfare changes by −40.
sources:
  - title: USITC · 2023 report on 2018–2021 tariff effects
    url: https://www.usitc.gov/press_room/news_release/2023/er0315_63679.htm
  - title: IB · Economics examiner guidance (2025)
    url: https://ibpublishing.ibo.org/exinst/apps/exinst/index.html?chapter=2&doc=EX_instructions_2025_e&part=10
